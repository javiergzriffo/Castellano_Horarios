rn `${day}-${mod}`}function activeCourses(l){return db.courses.filter(c=>c.plan===currentPlan&&c.level===l&&sectionsFor(c).length)}function getLevelOptions(){return [1,2,3,4,5]}function isReserve(c){return c.name==='CFG'||c.name==='Plan Común'}function isNormalSection(s){return !!course(s.courseId)}function displaySection(s){let c=course(s.courseId);return c?`${c.name} · S${s.number}`:'Sección eliminada'}function assigned(s){return (s.slots||[]).length}function issues(s,day,mod,ignore){const c=course(s.courseId),out=[];if(!c)return out;for(const r of db.reserves){if(r.level===c.level&&r.day===day&&r.mod===mod)out.push({type:'Reserva institucional',label:r.type+' · Nivel '+r.level,kind:'reserve',id:r.id})}for(const o of db.sections){if(o.id===s.id||o.id===ignore||!(o.slots||[]).some(z=>z.day===day&&z.mod===mod))continue;const oc=course(o.courseId);if(!oc)continue;let reasons=[];if(c.plan===oc.plan&&c.level===oc.level&&c.level!==0&&c.id!==oc.id)reasons.push('Coincidencia de cursos distintos en el mismo año y plan');if(s.teacherId&&o.teacherId===s.teacherId)reasons.push('Profesor con clase simultánea');if(c.id!==oc.id&&db.incompat.some(i=>(incompatMatches(i.a,s,c)&&incompatMatches(i.b,o,oc))||(incompatMatches(i.b,s,c)&&incompatMatches(i.a,o,oc))))reasons.push('Incompatibilidad configurada entre cursos o secciones');if(reasons.length)out.push({type:reasons.join(' / '),label:displaySection(o),kind:'section',id:o.id})}if(s.teacherId){let state=teacher(s.teacherId)?.availability?.[slotKey(day,mod)];if(state==='no')out.push({type:'Docente no disponible',label:teacher(s.teacherId)?.name,kind:'availability'})}return out}function allIssues(s){return (s.slots||[]).flatMap(z=>issues(s,z.day,z.mod).map(i=>({...i,day:z.day,mod:z.mod})))}function status(s){let c=course(s.courseId);if(!c)return 'Error';if(!s.teacherId)return 'Sin docente';if(c.level===0)return 'Completo';if(c.special&&!(Number(s.students)>=0))return 'Faltan estudiantes';if(count(c)===0)return 'Configurar módulos';if function renderYearCoincidences(){

 const pairs=new Map();
 for(let d=0;d<DAYS.length;d++)for(let m=0;m<TIMES.length;m++){

}

function renderPlanner(){let ls=getLevelOptions();if(!ls.includes(level))level=ls[0];let ss=db.sections.filter(s=>course(s.courseId)?.level===level);if(!section(selectedId)||course(section(selectedId).courseId)?.level!==level)selectedId=ss[0]?.id||'';let sel=section(selectedId),pr=progress(level);return `<div class="stats">${ls.map(l=>{let p=progress(l);return `<div class="stat" onclick="level=${l};selectedId='';render()" style="cursor:pointer;border:${l===level?'2px solid #2474ad':'2px solid transparent'}"><div class="small">${l}.º año</div><strong>${p.complete}/${p.total}</strong><div class="small muted">${p.missing} módulos pendientes</div><div class="bar"><span style="width:${p.total?100*p.complete/p.total:0}%"></span></div></div>`}).join('')}</div><div class="layout" style="margin-top:13px"><div><div class="panel"><div class="flex between"><h2>Horario conjunto · ${level}.º año · Planes B y C</h2><div class="flex">${namesel('levelSel',levels(),level,'level=Number(this.value);selectedId="";render()','Año')}<button class="${consultationMode?'primary':''}" onclick="consultationMode=!consultationMode;render()">${consultationMode?'✓ Consultando horarios':'🔎 Consultar simultáneos'}</button><button onclick="openRecommendations()" ${!sel?'disabled':''}>💡 Recomendaciones</button></div></div><div class="small muted" style="margin-bottom:10px">Selecciona una sección para programarla, o activa CFG / Plan Común para colocar bloques institucionales. Las secciones de un mismo curso pueden coincidir si tienen profesores distintos; cada sección conserva sus propios módulos.</div><div class="flex" style="margin-bottom:12px;gap:8px;flex-wrap:wrap"><button class="${institutionalMode==='CFG'?'primary':''}" onclick="chooseInstitutional('CFG')">${institutionalMode==='CFG'?'✓ ':'+ '}CFG</button><button class="${institutionalMode==='Plan Común'?'primary':''}" onclick="chooseInstitutional('Plan Común')">${institutionalMode==='Plan Común'?'✓ ':'+ '}Plan Común</button>${institutionalMode?`<span class="pill">Modo ${institutionalMode}: pulsa un espacio para agregarlo; pulsa una reserva para quitarla.</span><button onclick="institutionalMode='';render()">Terminar</button>`:''}</div>${consultationMode?'<p class="small muted">Modo consulta activo: pulsa cualquier celda de la grilla para ver qué se imparte en ese día y módulo, en todos los años. Pulsa el botón nuevamente para seguir programando.</p>':''}${renderGrid('level',level,sel,true)}</div><div class="panel"><div class="flex between"><h3>Secciones del año · Planes B y C</h3><span class="pill">${pr.total} secciones · ${pr.complete} completas</span></div>${ss.length?ss.map(s=>{let c=course(s.courseId);return `<div class="listitem ${selectedId===s.id?'active':''}"><div class="flex between"><div><b>${esc(c.name)}</b> <span class="tag">Plan ${c.plan} · ${esc(c.code)} · S${s.number}</span><div class="small muted">${esc(teacher(s.teacherId)?.name||'Sin profesor')} · ${c.level===0?'Sin módulos':assigned(s)+'/'+count(c)+' módulos'} · ${load(s)} h</div><div class="small ${status(s)==='Completo'?'good':'warn'}">${esc(status(s))}</div></div><div class="actions"><button onclick="selectSection('${s.id}')">Programar</button><button onclick="editSection('${s.id}')">Editar</button><button onclick="showPreview('course','${c.id}')">Ver curso</button></div></div></div>`}).join(''):'<p class="muted">No hay secciones activadas para este año. Actívalas en Oferta y secciones.</p>'}</div></div><div class="sticky">${consultationMode?renderSimultaneous():renderYearCoincidences()}<div class="panel"><div class="flex between"><h2>Sección en edición</h2>${sel?`<button onclick="clearSlots('${sel.id}')">Vaciar módulos</button>`:''}</div>${sel?`<b>${esc(displaySection(sel))}</b><div class="small muted">Plan ${course(sel.courseId).plan} · ${esc(course(sel.courseId).code)} · ${course(sel.courseId).credits} créditos · ${count(course(sel.courseId))} módulos requeridos</div><label>Profesor/a</label>${namesel('selteacher',teacherOpts(),sel.teacherId,`setSectionTeacher('${sel.id}',this.value)`,'Sin profesor')} ${course(sel.courseId).special?`<label>Estudiantes (carga: 0,5 × estudiante)</label><input type="number" min="0" value="${sel.students??0}" onchange="setStudents('${sel.id}',this.value)">`:''}<div class="flex" style="margin-top:10px"><span class="pill">${assigned(sel)}/${count(course(sel.courseId))} módulos</span><span class="pill">${load(sel)} horas</span></div>${allIssues(sel).length?`<p class="bad small">⚠ ${allIssues(sel).length} conflictos activos</p>`:''}`:'<p class="muted">Selecciona una sección para comenzar.</p>'}</div><div class="panel"><div class="flex between"><h2>Previsualización</h2><button onclick="previewVisible=!previewVisible;render()">${previewVisible?'Ocultar':'Mostrar'}</button></div>${previewVisible?`<div class="flex"><select onchange="previewType=this.value;previewId='';render()"><option value="teacher" ${previewType==='teacher'?'selected':''}>Profesor</option><option value="level" ${previewType==='level'?'selected':''}>Año</option><option value="course" ${previewType==='course'?'selected':''}>Curso</option></select><button onclick="pinned=!pinned;render()">${pinned?'📌 Fijada':'Fijar'}</button></div><div style="margin:9px 0">${namesel('previewSelect',previewType==='teacher'?teacherOpts():previewType==='level'?levels():courseOpts(),previewId,'previewId=this.value;render()','Elegir vista')}</div>${previewId?renderGrid(previewType,previewId,sel,false,true):'<p class="small muted">Selecciona qué horario deseas consultar. También puedes pulsar “Ver” junto a un curso o profesor.</p>'}`:''}</div></div></div>`}
function selectSection(id){selectedId=id;let s=section(id);if(!pinned&&s?.teacherId){previewType='teacher';previewId=s.teacherId}render()}function showPreview(type,id){previewVisible=true;if(!pinned){previewType=type;previewId=String(id)}render()}function setSectionTeacher(id,v){section(id).teacherId=v;if(!pinned&&v){previewType='teacher';previewId=v}commit()}function setStudents(id,v){section(id).students=Math.max(0,Number(v)||0);commit()}function clearSlots(id){if(confirm('¿Quitar todos los módulos de esta sección?')){section(id).slots=[];commit()}}
function renderGrid(type,id,sel,editable=false,compact=false){let html=`<div class="tablewrap"><div class="grid ${compact?'compact':''}"><div class="cell head">Módulo</div>${DAYS.map(d=>`<div class="cell head">${compact?d.slice(0,3):d}</div>`).join('')}`;for(let m=0;m<6;m++){html+=`<div class="cell time">${compact?'M'+(m+1):`M${m+1}<br>${TIMES[m]}`}</div>`;for(let d=0;d<6;d++){let matches=db.sections.filter(s=>(s.slots||[]).some(z=>z.day===d&&z.mod===m)&&((type==='level'&&course(s.courseId)?.level===Number(id))||(type==='teacher'&&s.teacherId===id)||(type==='course'&&s.courseId===id)));let reserves=type==='level'?db.reserves.filter(r=>r.level===Number(id)&&r.day===d&&r.mod===m):[];let conflict=editable&&sel?issues(sel,d,m):[];let selected=sel?.slots?.some(z=>z.day===d&&z.mod===m);let avail=editable&&sel?.teacherId?teacher(sel.teacherId)?.availability?.[slotKey(d,m)]:null;let cls=reserves.length?'reserved':matches.length?'busy':conflict.length?'blocked':avail==='no'?'off':avail==='pref'?'pref':editable?'free':'';if(selected)cls+=' selected';if(editable&&consultationMode&&d===consultDay&&m===consultMod)cls+=' consulting';let body=[...reserves.map(r=>`<b>${esc(r.type)}</b>`),...matches.map(s=>`<div>${esc(course(s.courseId)?.name)} <span class="tag">Plan ${course(s.courseId)?.plan} · S${s.number}</span>${type==='level'?`<div class="small muted">${esc(teacher(s.teacherId)?.name||'Sin profesor')}</div>`:''}</div>`)].join('');if(!body&&conflict.length)body=`<span class="bad">⛔ ${esc(conflict[0].label).slice(0,30)}</span>`;if(!body&&avail==='no')body='No disponible';if(!body&&avail==='pref')body='★ Preferido';if(!body)body=editable?'+':'·';let action=editable?`onclick="${consultationMode?'consultSlot':institutionalMode?'placeInstitutional':'clickSlot'}(${d},${m})" style="cursor:pointer" title="${esc(conflict.map(x=>x.type+': '+x.label).join('; '))}"`:'';html+=`<div class="cell ${cls}" ${action}>${body}${selected&&!compact?'<div class="good">✓ Asignado</div>':''}</div>`}}return html+'</div></div>'}
function clickSlot(day,mod){let s=section(selectedId);if(s&&course(s.courseId)?.level===0)return alert('GUÍA ACADÉMICA no requiere módulos en la grilla.');if(!s)return alert('Selecciona primero una sección.');if(s.slots.some(z=>z.day===day&&z.mod===mod)){s.slots=s.slots.filter(z=>!(z.day===day&&z.mod===mod));commit();return}let c=course(s.courseId);if(count(c)===0)return alert('Configura antes la cantidad de módulos de este curso.');if(s.slots.length>=count(c))return alert('Ya se asignaron todos los módulos requeridos. Quita uno para moverlo.');let blockers=issues(s,day,mod);if(blockers.length)return conflictModal(s,day,mod,blockers);s.slots.push({day,mod});commit()}
function modal(content){$('modalhost').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal">${content}</div></div>`}function closeModal(){$('modalhost').innerHTML=''}function conflictModal(s,d,m,blockers){modal(`<h2>⚠ Conflicto · ${DAYS[d]}, módulo ${m+1}</h2><p>Quieres programar <b>${esc(displaySection(s))}</b>, pero existen estas restricciones:</p>${blockers.map((b,i)=>`<div class="listitem"><b>${esc(b.type)}</b><div>${esc(b.label)}</div>${b.kind==='section'?`<div class="actions"><button onclick="removeConflictingSlot('${b.id}',${d},${m})">Quitar solo este módulo</button><button onclick="moveConflict('${b.id}',${d},${m})">Ver alternativas para moverlo</button><button onclick="showPreviewAndClose('course','${section(b.id)?.courseId}')">Previsualizar curso</button></div>`:b.kind==='reserve'?'<div class="small muted">Para modificar una reserva, usa Plan Común y CFG.</div>':'<div class="small muted">Modifica la disponibilidad en la ficha docente.</div>'}</div>`).join('')}<p class="small muted">Al quitar un módulo, su sección permanece activa y vuelve a figurar como pendiente.</p><button onclick="closeModal()">Cerrar</button>`)}function removeConflictingSlot(id,d,m){if(!confirm('¿Quitar únicamente este módulo de '+displaySection(section(id))+'?'))return;let s=section(id);s.slots=s.slots.filter(z=>!(z.day===d&&z.mod===m));let current=section(selectedId);let remaining=issues(current,d,m);if(!remaining.length&&current.slots.length<count(course(current.courseId))){current.slots.push({day:d,mod:m});closeModal();commit()}else{commit();conflictModal(current,d,m,remaining)}}function showPreviewAndClose(type,id){closeModal();showPreview(type,id)}function moveConflict(id,d,m){let s=section(id);let candidates=[];for(let dd=0;dd<6;dd++)for(let mm=0;mm<6;mm++){if((s.slots||[]).some(z=>z.day===dd&&z.mod===mm))continue;if(!issues(s,dd,mm).length)candidates.push({day:dd,mod:mm})}modal(`<h2>Reubicar ${esc(displaySection(s))}</h2><p class="small muted">Selecciona el nuevo módulo para reemplazar ${DAYS[d]} M${m+1}.</p><div class="actions">${candidates.slice(0,30).map(z=>`<button onclick="applyMove('${id}',${d},${m},${z.day},${z.mod})">${DAYS[z.day]} M${z.mod+1}</button>`).join('')||'No hay espacios sin conflictos.'}</div><p><button onclick="closeModal()">Cancelar</button></p>`)}function applyMove(id,d,m,nd,nm){let s=section(id);s.slots=s.slots.map(z=>z.day===d&&z.mod===m?{day:nd,mod:nm}:z);let current=section(selectedId);if(current&&current.id!==id&&!issues(current,d,m).length&&current.slots.length<count(course(current.courseId)))current.slots.push({day:d,mod:m});closeModal();commit()}
function openRecommendations(){let s=section(selectedId);if(!s)return;let needed=count(course(s.courseId))-s.slots.length;if(needed<=0)return modal('<h2>Programación completa</h2><p>Esta sección ya tiene todos sus módulos. Puedes quitar uno para explorar alternativas.</p><button onclick="closeModal()">Cerrar</button>');let candidates=[];for(let d=0;d<6;d++)for(let m=0;m<6;m++){if(s.slots.some(z=>z.day===d&&z.mod===m)||issues(s,d,m).length)continue;let a=teacher(s.teacherId)?.availability?.[slotKey(d,m)];let same=s.slots.filter(z=>z.day===d).length;let near=s.slots.some(z=>z.day===d&&Math.abs(z.mod-m)===1);let occupiedLevel=db.sections.filter(o=>course(o.courseId)?.level===course(s.courseId).level&&(o.slots||[]).some(z=>z.day===d)).length;let score=(a==='pref'?10:0)+same*8+(near?7:0)+occupiedLevel*1;candidates.push({d,m,score})}candidates.sort((a,b)=>b.score-a.score||a.d-b.d||a.m-b.m);let suggestions=[];for(let d=0;d<6;d++){let free=candidates.filter(x=>x.d===d);for(let i=0;i<=free.length-needed;i++){let pack=free.slice(i,i+needed);if(pack.length!==needed)continue;let contiguous=pack.every((x,j)=>j===0||x.m===pack[j-1].m+1);suggestions.push({slots:pack,score:pack.reduce((a,x)=>a+x.score,0)+(contiguous?20:0),label:`${DAYS[d]} · ${pack.map(x=>'M'+(x.m+1)).join(', ')}`})}}suggestions.sort((a,b)=>b.score-a.score);for(let x of candidates.slice(0,8)){if(needed===1)suggestions.push({slots:[x],score:x.score,label:`${DAYS[x.d]} M${x.m+1}`})}modal(`<h2>💡 Recomendaciones para ${esc(displaySection(s))}</h2><p class="small muted">Son sugerencias opcionales. Se priorizan módulos consecutivos, concentración en un mismo día y preferencias docentes. No se aplican sin tu confirmación.</p>${suggestions.slice(0,6).map((x,i)=>`<div class="listitem"><div class="flex between"><div><b>Opción ${i+1}</b><div>${esc(x.label)}</div></div><button onclick="applySuggestion('${encodeURIComponent(JSON.stringify(x.slots.map(y=>({day:y.d,mod:y.m}))))}')">Aplicar</button></div></div>`).join('')||'<p>No hay una combinación concentrada sin conflictos. Prueba liberar módulos o asignar otro profesor.</p>'}<button onclick="closeModal()">Cerrar</button>`)}function applySuggestion(encoded){let slots=JSON.parse(decodeURIComponent(encoded));let s=section(selectedId);if(!s)return;for(let z of slots){if(s.slots.length>=count(course(s.courseId)))break;if(!issues(s,z.day,z.mod).length&&!s.slots.some(x=>x.day===z.day&&x.mod===z.mod))s.slots.push(z)}closeModal();commit()}
function isInstitutional(c){return c&&(c.code.startsWith("CFG")||c.code.startsWith("EPC"))}
let offerYear=1,bankPicked=new Set();
function offerCourses(y){return db.courses.filter(c=>Number(c.level)===y&&!isInstitutional(c)&&sectionsFor(c).length).sort((a,b)=>a.name.localeCompare(b.name,'es'))}
function renderOffer(){let years=[1,2,3,4,5,0];return `<div class="panel"><h2>Construcción de la oferta académica</h2><p class="small muted">Selecciona un año o Guía Académica. Agrega asignaturas manualmente o desde el banco de los planes B y C; después ajusta el número de secciones. Los CFG y Plan Común se agregan directamente al construir horarios.</p><div class="flex" style="gap:8px;flex-wrap:wrap;margin:14px 0">${years.map(y=>`<button class="${offerYear===y?'primary':''}" onclick="offerYear=${y};render()">${y?y+'.º año':'GUÍA ACADÉMICA'} <span class="pill">${offerCourses(y).length}</span></button>`).join('')}</div></div><div class="panel"><div class="flex between"><h2>${offerYear?offerYear+'.º año':'GUÍA ACADÉMICA'} · ${offerCourses(offerYear).length} cursos</h2><div class="actions"><button onclick="addManualOffer()">+ Agregar curso manual</button><button class="primary" onclick="openCourseBank()">+ Agregar del banco de cursos</button></div></div><p class="small muted">${offerYear===0?'Estas asignaturas se asignan a profesores, suman su creditaje como carga y no aparecen en los horarios.':'Se muestran los cursos de ambos planes con secciones creadas. Puedes ajustar secciones y cambiar de año.'}</p><div class="tablewrap"><table><thead><tr><th>Plan</th><th>Código</th><th>Curso</th><th>Créditos</th><th>Año / destino</th><th>Secciones</th><th>Acciones</th></tr></thead><tbody>${offerCourses(offerYear).map(c=>`<tr><td>${esc(c.plan||'Manual')}</td><td>${esc(c.code)}</td><td><b>${esc(c.name)}</b></td><td>${c.credits}</td><td><select onchange="changeCourseLevel('${c.id}',this.value)">${years.map(y=>`<option value="${y}" ${c.level===y?'selected':''}>${y?y+'.º año':'GUÍA ACADÉMICA'}</option>`).join('')}</select></td><td><div class="actions"><button onclick="changeSections('${c.id}',-1)" aria-label="Quitar sección">−</button><b>${sectionsFor(c).length}</b><button onclick="changeSections('${c.id}',1)" aria-label="Agregar sección">+</button></div></td><td><div class="actions"><button onclick="editCourse('${c.id}')">Editar</button>${sectionsFor(c).map(sec=>`<button onclick="editSection('${sec.id}')">S${sec.number}</button>`).join('')}</div></td></tr>`).join('')||'<tr><td colspan="7" class="muted">Todavía no has agregado cursos a este espacio.</td></tr>'}</tbody></table></div></div>`}
function addManualOffer(){currentPlan='Manual';editCourse(null);setTimeout(()=>{if($('ecLevel'))$('ecLevel').value=String(offerYear)},0)}
function openCourseBank(){bankPicked=new Set();let options=db.courses.filter(c=>!isInstitutional(c)&&['B','C'].includes(c.plan));let html=`<h2>Banco de cursos · ${offerYear?offerYear+'.º año':'GUÍA ACADÉMICA'}</h2><p class="small muted">Marca todos los cursos que quieras incorporar. El banco contiene asignaturas de ambos planes, aunque su año original sea diferente. Cada curso nuevo se incorpora inicialmente con una sección.</p><div class="flex"><input id="bankSearch" placeholder="Buscar por código o nombre" oninput="filterBank()" style="flex:1"><select id="bankPlan" onchange="filterBank()"><option value="all">Ambos planes</option><option value="B">Plan B</option><option value="C">Plan C</option></select></div><div id="bankItems" style="max-height:360px;overflow:auto;border:1px solid #d5e1ec;border-radius:8px;margin:12px 0">${options.map(c=>`<label class="bankrow" data-search="${esc((c.code+' '+c.name).toLowerCase())}" data-plan="${esc(c.plan)}" style="display:flex;gap:9px;align-items:center;padding:9px;border-bottom:1px solid #edf1f5"><input type="checkbox" value="${esc(c.id)}" onchange="bankToggle(this)"><span><b>${esc(c.name)}</b><span class="small muted"> · Plan ${esc(c.plan)} · ${esc(c.code)} · ${c.credits} créditos · origen ${c.level||'Guía'}</span></span></label>`).join('')}</div><div class="actions"><span id="bankCount" class="pill">0 seleccionados</span><button class="primary" onclick="addBankCourses()">Agregar seleccionados</button><button onclick="closeModal()">Cancelar</button></div>`;modal(html)}
function bankToggle(el){if(el.checked)bankPicked.add(el.value);else bankPicked.delete(el.value);$('bankCount').textContent=bankPicked.size+' seleccionados'}
function filterBank(){let q=$('bankSearch').value.trim().toLowerCase(),pl=$('bankPlan').value;document.querySelectorAll('.bankrow').forEach(e=>e.style.display=(e.dataset.search.includes(q)&&(pl==='all'||e.dataset.plan===pl))?'flex':'none')}
function addBankCourses(){if(!bankPicked.size)return alert('Selecciona al menos un curso.');let added=0,existing=0;for(let id of bankPicked){let original=course(id);if(!original)continue;let c=db.courses.find(x=>x.plan===original.plan&&x.code===original.code&&Number(x.level)===offerYear);if(!c){if(!sectionsFor(original).length){original.level=offerYear;c=original}else{c={...original,id:uid(),level:offerYear,sections:0};db.courses.push(c)}}if(sectionsFor(c).length){existing++;continue}db.sections.push({id:uid(),courseId:c.id,number:1,teacherId:'',students:0,slots:[]});added++}closeModal();commit();if(existing)alert(`${added} cursos incorporados. ${existing} ya tenían secciones en este año y se conservaron sin duplicarlas.`)}
function changeCourseLevel(id,newLevel){let c=course(id);if(!c)return;let oldLevel=c.level;newLevel=Number(newLevel);if(oldLevel===newLevel)return;if(!Number.isInteger(newLevel)||newLevel<0||newLevel>5){render();return alert('Año no válido.')}let ss=sectionsFor(c),scheduled=ss.reduce((n,s)=>n+(s.slots||[]).length,0);if(scheduled&&!confirm(`Cambiar ${c.name} del año ${oldLevel} al ${newLevel} trasladará sus ${scheduled} módulos ya programados al horario del nuevo nivel. Se conservarán profesores y secciones, pero podrían aparecer conflictos. ¿Continuar?`)){render();return;}c.level=newLevel;if(newLevel===0)ss.forEach(s=>s.slots=[]);let conflicts=0;for(const sec of ss)for(const z of sec.slots||[])if(issues(sec,z.day,z.mod).length)conflicts++;commit();if(conflicts)alert(`Nivel actualizado. Atención: ${conflicts} módulo(s) presentan posibles conflictos en el nuevo nivel. Revísalos en Construir horarios.`)}
function changeSections(id,delta){if(isInstitutional(course(id)))return alert("CFG y Plan Común se colocan directamente desde Construir horarios, sin secciones.");let ss=db.sections.filter(s=>s.courseId===id);if(delta>0){let n=1;while(ss.some(s=>s.number===n))n++;db.sections.push({id:uid(),courseId:id,number:n,teacherId:'',students:0,slots:[]})}else if(ss.length){let s=ss[ss.length-1];if((s.slots.length||s.teacherId)&&!confirm('Esta sección tiene asignaciones. ¿Eliminarla igualmente?'))return;db.sections=db.sections.filter(x=>x.id!==s.id);db.incompat=db.incompat.filter(i=>i.a!=='s:'+s.id&&i.b!=='s:'+s.id)}commit()}function addCourse(){editCourse(null)}function editCourse(id){let c=id?course(id):{id:'',plan:currentPlan,code:'',name:'',credits:4,level:1,special:false,modules:2};modal(`<h2>${id?'Editar':'Agregar'} asignatura</h2><label>Código</label><input id="ecCode" value="${esc(c.code)}"><label>Nombre visible</label><input id="ecName" class="wide" value="${esc(c.name)}"><label>Año</label><select id="ecLevel">${[1,2,3,4,5,0].map(n=>`<option value="${n}" ${c.level===n?'selected':''}>${n||'GUÍA ACADÉMICA'}</option>`).join('')}</select><label>Créditos</label><input id="ecCredits" type="number" min="0" value="${c.credits}"><label>Módulos semanales (0 = sin definir)</label><input id="ecModules" type="number" min="0" value="${count(c)}"><p><label><input id="ecSpecial" type="checkbox" ${c.special?'checked':''}> Carga especial: 0,5 horas por estudiante, un módulo semanal</label></p><div class="actions"><button class="primary" onclick="saveCourse('${id||''}')">Guardar</button>${id?`<button class="danger" onclick="deleteCourse('${id}')">Eliminar asignatura</button>`:''}<button onclick="closeModal()">Cancelar</button></div>`)}function saveCourse(id){let code=$('ecCode').value.trim().toUpperCase(),name=$('ecName').value.trim();if(!code||!name)return alert('Ingresa código y nombre.');if(!id&&db.courses.some(c=>c.code===code&&c.plan===currentPlan&&c.level===Number($('ecLevel').value)))return alert('El código ya existe.');let c=id?course(id):{id:uid(),sections:0};Object.assign(c,{plan:c.plan||currentPlan,code,name,level:Number($('ecLevel').value),credits:Number($('ecCredits').value),modules:Number($('ecModules').value),special:$('ecSpecial').checked});if(c.special)c.modules=1;if(!id){db.courses.push(c);db.sections.push({id:uid(),courseId:c.id,number:1,teacherId:'',students:0,slots:[]})}closeModal();commit()}function deleteCourse(id){if(sectionsFor(course(id)).length)return alert('Primero elimina sus secciones.');if(!confirm('¿Eliminar esta asignatura del catálogo?'))return;db.courses=db.courses.filter(c=>c.id!==id);db.incompat=db.incompat.filter(i=>i.a!==id&&i.b!==id);closeModal();commit()}function editSection(id){let s=section(id),c=course(s.courseId);modal(`<h2>${esc(displaySection(s))}</h2><p>${esc(c.code)} · ${c.level?c.level+'.º año':'GUÍA ACADÉMICA'}</p><label>Profesor/a</label>${namesel('editTeacher',teacherOpts(),s.teacherId,'','Sin asignar')}<label>Número de sección</label><input id="editNumber" type="number" min="1" value="${s.number}">${c.special?`<label>Estudiantes</label><input id="editStudents" type="number" min="0" value="${s.students??0}">`:''}<p class="small muted">Los módulos ya programados se conservan al cambiar el profesor; se revisarán sus conflictos.</p><div class="actions"><button class="primary" onclick="saveSection('${id}')">Guardar</button><button class="danger" onclick="deleteSection('${id}')">Eliminar sección</button><button onclick="closeModal()">Cancelar</button></div>`)}function saveSection(id){let s=section(id);s.teacherId=$('editTeacher').value;s.number=Number($('editNumber').value)||1;if($('editStudents'))s.students=Number($('editStudents').value)||0;closeModal();commit()}function deleteSection(id){if(!confirm('¿Eliminar la sección y sus módulos?'))return;db.sections=db.sections.filter(s=>s.id!==id);db.incompat=db.incompat.filter(i=>i.a!=='s:'+id&&i.b!=='s:'+id);closeModal();commit()}
function renderTeachers(){return `<div class="panel"><div class="flex between"><h2>Profesores · ${db.teachers.length}</h2><button onclick="editTeacher('')">+ Agregar profesor/a</button></div><p class="small muted">Clic en Disponibilidad para marcar cada módulo como preferido, disponible o no disponible. La carga suma créditos por sección, salvo las actividades especiales.</p><div class="tablewrap"><table><thead><tr><th>Profesor/a</th><th>Secciones</th><th>Carga docente</th><th>Módulos</th><th>Acciones</th></tr></thead><tbody>${db.teachers.map(t=>{let ss=db.sections.filter(s=>s.teacherId===t.id);return `<tr><td>${esc(t.name)}</td><td>${ss.length}</td><td>${totalLoad(t)} h</td><td>${ss.reduce((a,s)=>a+s.slots.length,0)}</td><td><div class="actions"><button onclick="editTeacher('${t.id}')">Editar</button><button onclick="availabilityModal('${t.id}')">Disponibilidad</button><button onclick="printSchedule('teacher','${t.id}')">Ver horario</button><button class="danger" onclick="deleteTeacher('${t.id}')">Eliminar</button></div></td></tr>`}).join('')}</tbody></table></div></div>`}function editTeacher(id){let t=id?teacher(id):{name:''};modal(`<h2>${id?'Editar':'Agregar'} profesor/a</h2><label>Nombre</label><input id="teacherName" class="wide" value="${esc(t.name)}" placeholder="APELLIDOS, Nombre"><p><button class="primary" onclick="saveTeacher('${id}')">Guardar</button> <button onclick="closeModal()">Cancelar</button></p>`)}function saveTeacher(id){let name=$('teacherName').value.trim();if(!name)return alert('Escribe el nombre.');if(id)teacher(id).name=name;else db.teachers.push({id:uid(),name,availability:{}});closeModal();commit()}function deleteTeacher(id){let ss=db.sections.filter(s=>s.teacherId===id);if(!confirm(ss.length?`Este docente tiene ${ss.length} secciones. Se conservarán, pero quedarán sin profesor. ¿Continuar?`:'¿Eliminar profesor/a?'))return;ss.forEach(s=>s.teacherId='');db.teachers=db.teachers.filter(t=>t.id!==id);closeModal();commit()}function availabilityModal(id){let t=teacher(id);modal(`<h2>Disponibilidad · ${esc(t.name)}</h2><p class="small muted">Haz clic para alternar: disponible → preferido → no disponible. Los cambios se guardan al instante.</p><div class="tablewrap"><div class="grid compact"><div class="cell head">Mód.</div>${DAYS.map(d=>`<div class="cell head">${d.slice(0,3)}</div>`).join('')}${TIMES.map((tm,m)=>`<div class="cell head">M${m+1}</div>${DAYS.map((d,day)=>{let state=t.availability?.[slotKey(day,m)]||'yes';return `<div class="cell ${state==='pref'?'pref':state==='no'?'blocked':'free'}" style="cursor:pointer" onclick="cycleAvailability('${id}',${day},${m})">${state==='pref'?'★ Pref.':state==='no'?'⛔ No':'✓ Sí'}</div>`}).join('')}`).join('')}</div></div><p><button onclick="closeModal();render()">Cerrar</button></p>`)}function cycleAvailability(id,d,m){let t=teacher(id),key=slotKey(d,m),v=t.availability[key]||'yes';t.availability[key]=v==='yes'?'pref':v==='pref'?'no':'yes';persist();availabilityModal(id)}
function addSectionFromAssignments(){const id=$('assignmentAddCourse')?.value;if(!id)return alert('Selecciona un curso para agregar una sección.');changeSections(id,1)}
function renderAssignments(){let all=db.sections.filter(s=>course(s.courseId)&&!isInstitutional(course(s.courseId)));let filtered=all.filter(s=>{let c=course(s.courseId);return (assignmentLevel==='all'||String(c.level)===assignmentLevel)&&(!assignmentSearch||(`${c.name} ${c.code} ${teacher(s.teacherId)?.name||''} ${s.number}`).toLocaleLowerCase('es').includes(assignmentSearch.toLocaleLowerCase('es')))}).sort((a,b)=>{let ca=course(a.courseId),cb=course(b.courseId);return ca.level-cb.level||ca.name.localeCompare(cb.name,'es')||a.number-b.number});let missing=all.filter(s=>!s.teacherId).length;return `<div class="panel"><div class="flex between"><h2>Asignación docente · ${all.length} secciones activas</h2><span class="pill">${missing} sin profesor/a</span></div><p class="small muted">Aquí aparecen todos los cursos y secciones activados de ambos planes de estudios, sin filtro por plan. Asigna o cambia profesores directamente; la carga académica y los horarios se actualizan automáticamente. CFG y Plan Común no requieren asignación docente.</p><div class="flex" style="margin:12px 0"><label for="assignmentAddCourse" style="margin:0">Nueva sección de</label>${namesel('assignmentAddCourse',db.courses.filter(c=>!isInstitutional(c)).sort((a,b)=>a.level-b.level||a.name.localeCompare(b.name,'es')).map(c=>({value:c.id,label:`Plan ${c.plan||'—'} · ${c.level?c.level+'.º año':'GUÍA ACADÉMICA'} · ${c.name} (${c.code})`})),'','','Selecciona un curso')}<button class="primary" onclick="addSectionFromAssignments()">+ Agregar sección</button></div><div class="flex"><label for="assignmentLevel" style="margin:0">Año</label><select id="assignmentLevel" onchange="assignmentLevel=this.value;render()"><option value="all">Todos los años</option>${[...levels(),{value:0,label:'GUÍA ACADÉMICA'}].map(o=>`<option value="${o.value}" ${assignmentLevel===String(o.value)?'selected':''}>${o.label}</option>`).join('')}</select><input aria-label="Buscar sección" placeholder="Buscar curso, código o docente" value="${esc(assignmentSearch)}" oninput="assignmentSearch=this.value;render()"><button onclick="assignmentLevel='all';assignmentSearch='';render()">Limpiar filtros</button></div><div class="tablewrap"><table><thead><tr><th>Año</th><th>Plan</th><th>Curso</th><th>Sección</th><th>Profesor/a asignado/a</th><th>Carga docente</th><th>Horario</th><th>Acciones</th></tr></thead><tbody>${filtered.map(s=>{let c=course(s.courseId);return `<tr><td>${c.level||'GUÍA ACADÉMICA'}</td><td>Plan ${esc(c.plan||'—')}</td><td><b>${esc(c.name)}</b><div class="small muted">${esc(c.code)} · ${c.credits} créditos</div></td><td>S${s.number}</td><td>${namesel('assign_'+s.id,teacherOpts(),s.teacherId,`setSectionTeacher('${s.id}',this.value)`,'Sin asignar')}</td><td>${load(s)} h ${c.special?`<div class="small muted">${Number(s.students)||0} estudiantes</div>`:''}</td><td>${c.level===0?'Sin módulos':assigned(s)+'/'+count(c)+' módulos'} <div class="small ${status(s)==='Completo'?'good':'warn'}">${esc(status(s))}</div></td><td><div class="actions"><button onclick="changeSections('${c.id}',1)">+ Sección</button><button onclick="editSection('${s.id}')">Editar</button>${c.level?`<button onclick="level=${c.level};tab='programar';selectSection('${s.id}')">Programar</button>`:'<span class="muted small">Sin horario</span>'}</div></td></tr>`}).join('')||'<tr><td colspan="8" class="muted">No hay secciones que coincidan con los filtros. Activa cursos desde Oferta y secciones.</td></tr>'}</tbody></table></div></div>`}
function renderReserves(){return `<div class="panel"><h2>Bloques institucionales · Plan Común y CFG</h2><p class="small muted">Registra los horarios informados por Secretaría de Estudios. Estas reservas bloquean las asignaciones de ambos planes para el año correspondiente.</p><div class="flex"><select id="resLevel">${levels().map(o=>`<option value="${o.value}">${o.label}</option>`).join('')}</select><select id="resType"><option>Plan Común</option><option>CFG</option></select><select id="resDay">${DAYS.map((d,i)=>`<option value="${i}">${d}</option>`).join('')}</select><select id="resMod">${TIMES.map((x,i)=>`<option value="${i}">M${i+1} · ${x}</option>`).join('')}</select><button class="primary" onclick="addReserve()">+ Reservar bloque</button></div><div class="tablewrap"><table><tr><th>Año</th><th>Tipo</th><th>Día</th><th>Módulo</th><th></th></tr>${db.reserves.map(r=>`<tr><td>${r.level}</td><td>${esc(r.type)}</td><td>${DAYS[r.day]}</td><td>M${r.mod+1}</td><td><button class="danger" onclick="removeReserve('${r.id}')">Quitar</button></td></tr>`).join('')}</table></div></div>`}function addReserve(){let level=Number($('resLevel').value),type=$('resType').value,day=Number($('resDay').value),mod=Number($('resMod').value);if(db.reserves.some(r=>r.level===level&&r.day===day&&r.mod===mod))return alert('Este bloque ya está reservado.');db.reserves.push({id:uid(),plan:currentPlan,level,type,day,mod});commit()}function removeReserve(id){if(confirm('¿Eliminar esta reserva institucional?')){db.reserves=db.reserves.filter(r=>r.id!==id);commit()}}
function incompatMatches(endpoint,s,c){return endpoint===c.id||endpoint==='s:'+s.id||(endpoint.startsWith('y:')&&Number(endpoint.slice(2))===Number(c.level)&&Number(c.level)>0)}
function incompatOptions(){let result=[];for(const c of db.courses){if(isInstitutional(c))continue;const ss=sectionsFor(c);if(!ss.length)continue;result.push({value:c.id,label:`${c.code} · ${c.name} · Curso completo (${ss.length} ${ss.length===1?'sección':'secciones'})`});for(const s of ss)result.push({value:'s:'+s.id,label:`↳ ${c.code} · ${c.name} · S${s.number}${s.teacherId?' · '+(teacher(s.teacherId)?.name||''):''}`})}return result.sort((a,b)=>a.label.replace(/^↳ /,'').localeCompare(b.label.replace(/^↳ /,''),'es'))}
function incompatLabel(endpoint){if(endpoint.startsWith('y:'))return `${endpoint.slice(2)}.º año · todos los cursos con secciones (ambos planes)`;if(endpoint.startsWith('s:')){const s=section(endpoint.slice(2));if(!s)return 'Sección eliminada';const c=course(s.courseId);return `${c?.code||''} · ${c?.name||''} · S${s.number} (sección específica)`}const c=course(endpoint);return c?`${c.code} · ${c.name} (todas sus secciones)`:'Curso eliminado'}
function renderRestrictions(){const opts=incompatOptions();const selector=(id,placeholder,yearOptions=false)=>`<select id="${id}" style="max-width:420px"><option value="">${placeholder}</option>${yearOptions?'<optgroup label="Año completo">'+[1,2,3,4,5].map(y=>`<option value="y:${y}">${y}.º año · todos los cursos con secciones</option>`).join('')+'</optgroup>':''}<optgroup label="Cursos y secciones con oferta">${opts.map(o=>`<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('')}</optgroup></select>`;return `<div class="panel"><h2>Incompatibilidades entre cursos, secciones y años</h2><p class="muted small">Solo se muestran cursos con secciones creadas, de ambos planes. Puedes relacionar un curso o sección con otro curso, una sección específica o <b>todos los cursos de un año</b>. Las restricciones por año incluyen automáticamente los cursos con secciones que se agreguen después, sin considerar CFG ni Plan Común.</p><div class="flex">${selector('incA','Curso o sección de origen')} ${selector('incB','Curso, sección o año de destino',true)} <button class="primary" onclick="addIncompat()">+ Agregar incompatibilidad</button></div>${opts.length===0?'<p class="muted">Crea secciones en Oferta y secciones para configurar incompatibilidades.</p>':''}<div class="tablewrap"><table><tr><th>Curso o sección A</th><th>Curso, sección o año B</th><th>Acción</th></tr>${db.incompat.map(i=>`<tr><td>${esc(incompatLabel(i.a))}</td><td>${esc(incompatLabel(i.b))}</td><td><button class="danger" onclick="removeIncompat('${i.id}')">Eliminar</button></td></tr>`).join('')}</table></div></div>`}
function addIncompat(){let a=$('incA').value,b=$('incB').value;if(!a||!b||a===b)return alert('Selecciona dos elementos distintos.');const sourceCourse=a.startsWith('s:')?course(section(a.slice(2))?.courseId):course(a);if(b.startsWith('y:')&&sourceCourse?.level===Number(b.slice(2)))return alert('El curso o sección pertenece a ese mismo año. Selecciona otro año para evitar una incompatibilidad consigo mismo.');if(db.incompat.some(i=>(i.a===a&&i.b===b)||(i.a===b&&i.b===a)))return alert('Ya existe esta regla.');db.incompat.push({id:uid(),a,b});commit()}
function removeIncompat(id){db.incompat=db.incompat.filter(i=>i.id!==id);commit()}
function renderExport(){return `<div class="panel"><h2>Exportar horarios en PDF</h2><p class="small muted">Elige un horario individual o todos los horarios de un tipo. Se abrirá una vista preparada para imprimir; en el cuadro de impresión del navegador selecciona «Guardar como PDF».</p><div class="flex"><select id="exportType" onchange="renderExportOptions()"><option value="level">Por año (ambos planes)</option><option value="teacher">Por profesor</option><option value="course">Por curso</option></select><span id="exportOptions"></span><button class="primary" onclick="printSchedule()">Preparar PDF</button></div></div><div class="panel"><h2>Respaldo del proyecto</h2><p>Los cambios se guardan automáticamente en este navegador. Para conservar versiones o trasladar la programación a otro equipo, descarga un JSON e impórtalo desde «Abrir proyecto».</p><div class="actions"><button onclick="saveJSON()">Descargar JSON</button><button onclick="document.getElementById('importFile').click()">Importar JSON</button><button class="danger" onclick="resetProject()">Restablecer proyecto</button></div></div>`}function renderExportOptions(){let type=$('exportType').value,opts=type==='level'?levels():type==='teacher'?teacherOpts():courseOpts();$('exportOptions').innerHTML=`<select id="exportTarget"><option value="all">Todos</option>${opts.map(o=>`<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('')}</select>`}function printSchedule(typeOverride,targetOverride){let type=typeOverride||$('exportType').value,target=targetOverride||$('exportTarget').value;let opts=type==='level'?levels():type==='teacher'?teacherOpts():courseOpts();let items=target==='all'?opts:opts.filter(o=>String(o.value)===target);let content=`<!doctype html><html lang="es"><head><meta charset="utf-8"><title>${esc(db.careerName)} · Horarios ${esc(db.semester)}</title><style>body{font-family:Arial,sans-serif;color:#17304c}h1{font-size:18px}h2{font-size:16px}table{border-collapse:collapse;width:100%;table-layout:fixed}th,td{border:1px solid #bccbd8;padding:7px;font-size:10px;vertical-align:top;height:56px;overflow-wrap:anywhere}th{background:#e5edf6}td.busy{background:#e5effb}td.res{background:#fff0d5}.page{break-after:page;margin-bottom:15px}@page{size:A4 landscape;margin:10mm}button{padding:9px;margin:10px}</style></head><body><button onclick="window.print()">Imprimir / Guardar como PDF</button>`;for(let item of items){content+=`<div class="page"><h1>${esc(db.careerName)} · ${esc(db.semester)}</h1><h2>${esc(item.label)}</h2><table><tr><th>Módulo</th>${DAYS.map(d=>`<th>${d}</th>`).join('')}</tr>`;for(let m=0;m<6;m++){content+=`<tr><th>M${m+1}<br>${TIMES[m]}</th>`;for(let d=0;d<6;d++){let ss=db.sections.filter(s=>s.slots.some(z=>z.day===d&&z.mod===m)&&(type==='level'?course(s.courseId)?.level===Number(item.value):type==='teacher'?s.teacherId===item.value:s.courseId===item.value));let rs=type==='level'?db.reserves.filter(r=>r.level===Number(item.value)&&r.day===d&&r.mod===m):[];content+=`<td class="${rs.length?'res':ss.length?'busy':''}">${rs.map(r=>esc(r.type)).join('<br>')}${ss.map(s=>`${esc(course(s.courseId)?.name)} · Plan ${esc(course(s.courseId)?.plan)} · S${s.number}<br><small>${esc(teacher(s.teacherId)?.name||'Sin profesor')}</small>`).join('<hr>')}</td>`}content+='</tr>'}content+='</table></div>'}content+='</body></html>';let w=window.open('','_blank');if(!w)return alert('Permite las ventanas emergentes para generar el PDF.');w.document.write(content);w.document.close()}function saveJSON(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Horarios_${db.semester.replace(/[^a-zA-Z0-9-]/g,'_')}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function loadJSON(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.courses)||!Array.isArray(d.sections)||!Array.isArray(d.teachers))throw Error('Estructura no válida');if(!confirm('¿Reemplazar el proyecto actual con el archivo importado?'))return;db=d;normalize();selectedId='';commit()}catch(err){alert('No se pudo importar: '+err.message)}};r.readAsText(file);e.target.value=''}function resetProject(){if(!confirm('¿Restablecer todos los datos a la nómina y catálogo iniciales? Descarga antes un respaldo si necesitas conservar cambios.'))return;db=structuredClone(SEED);selectedId='';commit()}
render();if(tab==='exportar')renderExportOptions();const oldChangeTab=changeTab;changeTab=function(t){tab=t;render();if(t==='exportar')renderExportOptions()};
</script></body></html>
