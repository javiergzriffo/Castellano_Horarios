function clickSlot(day,mod){let s=section(selectedId);if(s&&course(s.courseId)?.level===0)return alert('GUÍA ACADÉMICA no requiere módulos en la grilla.');if(!s)return alert('Selecciona primero una sección.');if(s.slots.some(z=>z.day===day&&z.mod===mod)){s.slots=s.slots.filter(z=>!(z.day===day&&z.mod===mod));commit();return}let c=course(s.courseId);if(count(c)===0)return alert('Configura antes la cantidad de módulos de este curso.');if(s.slots.length>=count(c))return alert('Ya se asignaron todos los módulos requeridos. Quita uno para moverlo.');let blockers=issues(s,day,mod);if(blockers.length)return conflictModal(s,day,mod,blockers);s.slots.push({day,mod});commit()}
function modal(content){$('modalhost').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal">${content}</div></div>`}function closeModal(){$('modalhost').innerHTML=''}function conflictModal(s,d,m,blockers){modal(`<h2>⚠ Conflicto · ${DAYS[d]}, módulo ${m+1}</h2><p>Quieres programar <b>${esc(displaySection(s))}</b>, pero existen estas restricciones:</p>${blockers.map((b,i)=>`<div class="listitem"><b>${esc(b.type)}</b><div>${esc(b.label)}</div>${b.kind==='section'?`<div class="actions"><button onclick="removeConflictingSlot('${b.id}',${d},${m})">Quitar solo este módulo</button><button onclick="moveConflict('${b.id}',${d},${m})">Ver alternativas para moverlo</button><button onclick="showPreviewAndClose('course','${section(b.id)?.courseId}')">Previsualizar curso</button></div>`:b.kind==='reserve'?'<div class="small muted">Para modificar una reserva, usa Plan Común y CFG.</div>':'<div class="small muted">Modifica la disponibilidad en la ficha docente.</div>'}</div>`).join('')}<p class="small muted">Al quitar un módulo, su sección permanece activa y vuelve a figurar como pendiente.</p><button onclick="closeModal()">Cerrar</button>`)}function removeConflictingSlot(id,d,m){if(!confirm('¿Quitar únicamente este módulo de '+displaySection(section(id))+'?'))return;let s=section(id);s.slots=s.slots.filter(z=>!(z.day===d&&z.mod===m));let current=section(selectedId);let remaining=issues(current,d,m);if(!remaining.length&&current.slots.length<count(course(current.courseId))){current.slots.push({day:d,mod:m});closeModal();commit()}else{commit();conflictModal(current,d,m,remaining)}}function showPreviewAndClose(type,id){closeModal();showPreview(type,id)}function moveConflict(id,d,m){let s=section(id);let candidates=[];for(let dd=0;dd<6;dd++)for(let mm=0;mm<6;mm++){if((s.slots||[]).some(z=>z.day===dd&&z.mod===mm))continue;if(!issues(s,dd,mm).length)candidates.push({day:dd,mod:mm})}modal(`<h2>Reubicar ${esc(displaySection(s))}</h2><p class="small muted">Selecciona el nuevo módulo para reemplazar ${DAYS[d]} M${m+1}.</p><div class="actions">${candidates.slice(0,30).map(z=>`<button onclick="applyMove('${id}',${d},${m},${z.day},${z.mod})">${DAYS[z.day]} M${z.mod+1}</button>`).join('')||'No hay espacios sin conflictos.'}</div><p><button onclick="closeModal()">Cancelar</button></p>`)}function applyMove(id,d,m,nd,nm){let s=section(id);s.slots=s.slots.map(z=>z.day===d&&z.mod===m?{day:nd,mod:nm}:z);let current=section(selectedId);if(current&&current.id!==id&&!issues(current,d,m).length&&current.slots.length<count(course(current.courseId)))current.slots.push({day:d,mod:m});closeModal();commit()}
function openRecommendations(){let s=section(selectedId);if(!s)return;let needed=count(course(s.courseId))-s.slots.length;if(needed<=0)return modal('<h2>Programación completa</h2><p>Esta sección ya tiene todos sus módulos. Puedes quitar uno para explorar alternativas.</p><button onclick="closeModal()">Cerrar</button>');let candidates=[];for(let d=0;d<6;d++)for(let m=0;m<6;m++){if(s.slots.some(z=>z.day===d&&z.mod===m)||issues(s,d,m).length)continue;let a=teacher(s.teacherId)?.availability?.[slotKey(d,m)];let same=s.slots.filter(z=>z.day===d).length;let near=s.slots.some(z=>z.day===d&&Math.abs(z.mod-m)===1);let occupiedLevel=db.sections.filter(o=>course(o.courseId)?.level===course(s.courseId).level&&(o.slots||[]).some(z=>z.day===d)).length;let score=(a==='pref'?10:0)+same*8+(near?7:0)+occupiedLevel*1;candidates.push({d,m,score})}candidates.sort((a,b)=>b.score-a.score||a.d-b.d||a.m-b.m);let suggestions=[];for(let d=0;d<6;d++){let free=candidates.filter(x=>x.d===d);for(let i=0;i<=free.length-needed;i++){let pack=free.slice(i,i+needed);if(pack.length!==needed)continue;let contiguous=pack.every((x,j)=>j===0||x.m===pack[j-1].m+1);suggestions.push({slots:pack,score:pack.reduce((a,x)=>a+x.score,0)+(contiguous?20:0),label:`${DAYS[d]} · ${pack.map(x=>'M'+(x.m+1)).join(', ')}`})}}suggestions.sort((a,b)=>b.score-a.score);for(let x of candidates.slice(0,8)){if(needed===1)suggestions.push({slots:[x],score:x.score,label:`${DAYS[x.d]} M${x.m+1}`})}modal(`<h2>💡 Recomendaciones para ${esc(displaySection(s))}</h2><p class="small muted">Son sugerencias opcionales. Se priorizan módulos consecutivos, concentración en un mismo día y preferencias docentes. No se aplican sin tu confirmación.</p>${suggestions.slice(0,6).map((x,i)=>`<div class="listitem"><div class="flex between"><div><b>Opción ${i+1}</b><div>${esc(x.label)}</div></div><button onclick="applySuggestion('${encodeURIComponent(JSON.stringify(x.slots.map(y=>({day:y.d,mod:y.m}))))}')">Aplicar</button></div></div>`).join('')||'<p>No hay una combinación concentrada sin conflictos. Prueba liberar módulos o asignar otro profesor.</p>'}<button onclick="closeModal()">Cerrar</button>`)}function applySuggestion(encoded){let slots=JSON.parse(decodeURIComponent(encoded));let s=section(selectedId);if(!s)return;for(let z of slots){if(s.slots.length>=count(course(s.courseId)))break;if(!issues(s,z.day,z.mod).length&&!s.slots.some(x=>x.day===z.day&&x.mod===z.mod))s.slots.push(z)}closeModal();commit()}

function openCourseBank(){bankPicked=new Set();let options=db.curriculum.filter(c=>!isInstitutional(c)).sort((a,b)=>a.plan.localeCompare(b.plan)||a.year-b.year||a.code.localeCompare(b.code));let lastGroup='';let html=`<h2>Banco de cursos · ${offerYear?offerYear+'.º año':'GUÍA ACADÉMICA'}</h2><p class="small muted">Selecciona varios cursos. El banco se administra en Configurar planes.</p><div class="flex"><input id="bankSearch" placeholder="Buscar por código o nombre" oninput="filterBank()"><select id="bankPlan" onchange="filterBank()"><option value="all">Ambos planes</option>${[...new Set(db.curriculum.map(c=>c.plan))].map(p=>`<option value="${esc(p)}">Plan ${esc(p)}</option>`).join('')}</select></div><div style="max-height:48vh;overflow:auto;margin:12px 0">${options.map(c=>{let group=c.plan+'|'+c.year;let heading=group!==lastGroup?`<div class="bankgroup" data-plan="${esc(c.plan)}" style="position:sticky;top:0;background:#e9f0f8;padding:8px;font-weight:700;margin-top:9px">Plan ${esc(c.plan)} · ${c.year||'Guía'}.º año</div>`:'';lastGroup=group;return heading+`<label class="bankrow flex" data-plan="${esc(c.plan)}" data-search="${esc((c.code+' '+c.name).toLowerCase())}" style="border-bottom:1px solid #e7edf3;padding:6px"><input type="checkbox" value="${esc(c.id)}" onchange="bankToggle(this)"><span><b>${esc(c.code)}</b> · ${esc(c.name)} <span class="muted">Plan ${esc(c.plan)} · ${c.credits} créditos · origen ${c.year||'Guía'}</span></span></label>`}).join('')}</div><div class="actions"><span id="bankCount" class="pill">0 seleccionados</span><button class="primary" onclick="addBankCourses()">Agregar seleccionados</button><button onclick="closeModal()">Cancelar</button></div>`;modal(html)}

function changeCourseLevel(id,newLevel){let c=course(id);if(!c)return;let oldLevel=c.level;newLevel=Number(newLevel);if(oldLevel===newLevel)return;if(!Number.isInteger(newLevel)||newLevel<0||(!db.years.includes(newLevel)&&newLevel!==0)){render();return alert('Año no válido.')}let ss=sectionsFor(c),scheduled=ss.reduce((n,s)=>n+(s.slots||[]).length,0);if(scheduled&&!confirm(`Cambiar ${c.name} del año ${oldLevel} al ${newLevel} trasladará sus ${scheduled} módulos ya programados al horario del nuevo año. Se conservarán profesores y secciones, pero podrían aparecer conflictos. ¿Continuar?`)){render();return;}c.level=newLevel;if(newLevel===0)ss.forEach(s=>s.slots=[]);let conflicts=0;for(const sec of ss)for(const z of sec.slots||[])if(issues(sec,z.day,z.mod).length)conflicts++;commit();if(conflicts)alert(`Año actualizado. Atención: ${conflicts} módulo(s) presentan posibles conflictos en el nuevo año. Revísalos en Construir horarios.`)}
function changeSections(id,delta){if(isInstitutional(course(id)))return alert("CFG y Plan Común se colocan directamente desde Construir horarios, sin secciones.");let ss=db.sections.filter(s=>s.courseId===id);if(delta>0){let n=1;while(ss.some(s=>s.number===n))n++;db.sections.push({id:uid(),courseId:id,number:n,teacherId:'',students:0,slots:[]})}else if(ss.length){let s=ss[ss.length-1];if((s.slots.length||s.teacherId)&&!confirm('Esta sección tiene asignaciones. ¿Eliminarla igualmente?'))return;db.sections=db.sections.filter(x=>x.id!==s.id);db.incompat=db.incompat.filter(i=>i.a!=='s:'+s.id&&i.b!=='s:'+s.id)}commit()}function addCourse(){editCourse(null)}function editCourse(id){let c=id?course(id):{id:'',plan:currentPlan,code:'',name:'',credits:4,level:1,special:false,modules:2};modal(`<h2>${id?'Editar':'Agregar'} asignatura</h2><label>Código</label><input id="ecCode" value="${esc(c.code)}"><label>Nombre visible</label><input id="ecName" class="wide" value="${esc(c.name)}"><label>Año</label><select id="ecLevel">${[1,2,3,4,5,0].map(n=>`<option value="${n}" ${c.level===n?'selected':''}>${n||'GUÍA ACADÉMICA'}</option>`).join('')}</select><label>Créditos</label><input id="ecCredits" type="number" min="0" value="${c.credits}"><label>Módulos semanales (0 = sin definir)</label><input id="ecModules" type="number" min="0" value="${count(c)}"><p><label><input id="ecSpecial" type="checkbox" ${c.special?'checked':''}> Carga especial: 0,5 horas por estudiante, un módulo semanal</label></p><div class="actions"><button class="primary" onclick="saveCourse('${id||''}')">Guardar</button>${id?`<button class="danger" onclick="deleteCourse('${id}')">Eliminar asignatura</button>`:''}<button onclick="closeModal()">Cancelar</button></div>`)}function saveCourse(id){let code=$('ecCode').value.trim().toUpperCase(),name=$('ecName').value.trim();if(!code||!name)return alert('Ingresa código y nombre.');if(!id&&db.courses.some(c=>c.code===code&&c.plan===currentPlan&&c.level===Number($('ecLevel').value)))return alert('El código ya existe.');let c=id?course(id):{id:uid(),sections:0};Object.assign(c,{plan:c.plan||currentPlan,code,name,level:Number($('ecLevel').value),credits:Number($('ecCredits').value),modules:Number($('ecModules').value),special:$('ecSpecial').checked});if(c.special)c.modules=1;if(!id){db.courses.push(c);db.sections.push({id:uid(),courseId:c.id,number:1,teacherId:'',students:0,slots:[]})}closeModal();commit()}function deleteCourse(id){if(sectionsFor(course(id)).length)return alert('Primero elimina sus secciones.');if(!confirm('¿Eliminar esta asignatura del catálogo?'))return;db.courses=db.courses.filter(c=>c.id!==id);db.incompat=db.incompat.filter(i=>i.a!==id&&i.b!==id);closeModal();commit()}function editSection(id){let s=section(id),c=course(s.courseId);modal(`<h2>${esc(displaySection(s))}</h2><p>${esc(c.code)} · ${c.level?c.level+'.º año':'GUÍA ACADÉMICA'}</p><label>Profesor/a</label>${namesel('editTeacher',teacherOpts(),s.teacherId,'','Sin asignar')}<label>Número de sección</label><input id="editNumber" type="number" min="1" value="${s.number}">${c.special?`<label>Estudiantes</label><input id="editStudents" type="number" min="0" value="${s.students??0}">`:''}<p class="small muted">Los módulos ya programados se conservan al cambiar el profesor; se revisarán sus conflictos.</p><div class="actions"><button class="primary" onclick="saveSection('${id}')">Guardar</button><button class="danger" onclick="deleteSection('${id}')">Eliminar sección</button><button onclick="closeModal()">Cancelar</button></div>`)}function saveSection(id){let s=section(id);s.teacherId=$('editTeacher').value;s.number=Number($('editNumber').value)||1;if($('editStudents'))s.students=Number($('editStudents').value)||0;closeModal();commit()}function deleteSection(id){if(!confirm('¿Eliminar la sección y sus módulos?'))return;db.sections=db.sections.filter(s=>s.id!==id);db.incompat=db.incompat.filter(i=>i.a!=='s:'+id&&i.b!=='s:'+id);closeModal();commit()}
function renderTeachers(){return `<div class="panel"><div class="flex between"><h2>Profesores · ${db.teachers.length}</h2><button onclick="editTeacher('')">+ Agregar profesor/a</button></div><p class="small muted">Clic en Disponibilidad para marcar cada módulo como preferido, disponible o no disponible. La carga suma créditos por sección, salvo las actividades especiales.</p><div class="tablewrap"><table><thead><tr><th>Profesor/a</th><th>Secciones</th><th>Carga docente</th><th>Módulos</th><th>Acciones</th></tr></thead><tbody>${db.teachers.map(t=>{let ss=db.sections.filter(s=>s.teacherId===t.id);return `<tr><td>${esc(t.name)}</td><td>${ss.length}</td><td>${totalLoad(t)} h</td><td>${ss.reduce((a,s)=>a+s.slots.length,0)}</td><td><div class="actions"><button onclick="editTeacher('${t.id}')">Editar</button><button onclick="availabilityModal('${t.id}')">Disponibilidad</button><button onclick="printSchedule('teacher','${t.id}')">Ver horario</button><button class="danger" onclick="deleteTeacher('${t.id}')">Eliminar</button></div></td></tr>`}).join('')}</tbody></table></div></div>`}function editTeacher(id){let t=id?teacher(id):{name:''};modal(`<h2>${id?'Editar':'Agregar'} profesor/a</h2><label>Nombre</label><input id="teacherName" class="wide" value="${esc(t.name)}" placeholder="APELLIDOS, Nombre"><p><button class="primary" onclick="saveTeacher('${id}')">Guardar</button> <button onclick="closeModal()">Cancelar</button></p>`)}function saveTeacher(id){let name=$('teacherName').value.trim();if(!name)return alert('Escribe el nombre.');if(id)teacher(id).name=name;else db.teachers.push({id:uid(),name,availability:{}});closeModal();commit()}function deleteTeacher(id){let ss=db.sections.filter(s=>s.teacherId===id);if(!confirm(ss.length?`Este docente tiene ${ss.length} secciones. Se conservarán, pero quedarán sin profesor. ¿Continuar?`:'¿Eliminar profesor/a?'))return;ss.forEach(s=>s.teacherId='');db.teachers=db.teachers.filter(t=>t.id!==id);closeModal();commit()}function availability function renderAssignments(){let all=db.sections.filter(s=>course(s.courseId)&&!isInstitutional(course(s.courseId)));let filtered=all.filter(s=>{let c=course(s.courseId);return (assignmentLevel==='all'||String(c.level)===assignmentLevel)&&(!assignmentSearch||(`${c.name} ${c.code} ${teacher(s.teacherId)?.name||''} ${s.number}`).toLocaleLowerCase('es').includes(assignmentSearch.toLocaleLowerCase('es')))}).sort((a,b)=>{let ca=course(a.courseId),cb=course(b.courseId);return ca.level-cb.level||ca.name.localeCompare(cb.name,'es')||a.number-b.number});let missing=all.filter(s=>!s.teacherId).length;return `<div class="panel"><div class="flex between"><h2>Asignación docente · ${all.length} secciones activas</h2><span class="pill">${missing} sin profesor/a</span></div><p class="small muted">Aquí aparecen todos los cursos y secciones activados de ambos planes de estudios, sin filtro por plan. Asigna o cambia profesores directamente; la carga académica y los horarios se actualizan automáticamente. CFG y Plan Común no requieren asignación docente.</p><div class="flex" style="margin:12px 0"><label for="assignmentAddCourse" style="margin:0">Nueva sección de</label>${namesel('assignmentAddCourse',db.courses.filter(c=>!isInstitutional(c)).sort((a,b)=>a.level-b.level||a.name.localeCompare(b.name,'es')).map(c=>({value:c.id,label:`Plan ${c.plan||'—'} · ${c.level?c.level+'.º año':'GUÍA ACADÉMICA'} · ${c.name} (${c.code})`})),'','','Selecciona un curso')}<button class="primary" onclick="addSectionFromAssignments()">+ Agregar sección</button></div><div class="flex"><label for="assignmentLevel" style="margin:0">Año</label><select id="assignmentLevel" onchange="assignmentLevel=this.value;render()"><option value="all">Todos los años</option>${[...levels(),{value:0,label:'GUÍA ACADÉMICA'}].map(o=>`<option value="${o.value}" ${assignmentLevel===String(o.value)?'selected':''}>${o.label}</option>`).join('')}</select><input aria-label="Buscar sección" placeholder="Buscar curso, código o docente" value="${esc(assignmentSearch)}" oninput="assignmentSearch=this.value;render()"><button onclick="assignmentLevel='all';assignmentSearch='';render()">Limpiar filtros</button></div><div class="tablewrap"><table><thead><tr><th>Año</th><th>Plan</th><th>Curso</th><th>Sección</th><th>Profesor/a asignado/a</th><th>Carga docente</th><th>Horario</th><th>Acciones</th></tr></thead><tbody>${filtered.map(s=>{let c=course(s.courseId);return `<tr><td>${c.level||'GUÍA ACADÉMICA'}</td><td>Plan ${esc(c.plan||'—')}</td><td><b>${esc(c.name)}</b><div class="small muted">${esc(c.code)} · ${c.credits} créditos</div></td><td>S${s.number}</td><td>${namesel('assign_'+s.id,teacherOpts(),s.teacherId,`setSectionTeacher('${s.id}',this.value)`,'Sin asignar')}</td><td>${load(s)} h ${c.special?`<div class="small muted">${Number(s.students)||0} estudiantes</div>`:''}</td><td>${c.level===0?'Sin módulos':assigned(s)+'/'+count(c)+' módulos'} <div class="small ${status(s)==='Completo'?'good':'warn'}">${esc(status(s))}</div></td><td><div class="actions"><button onclick="changeSections('${c.id}',1)">+ Sección</button><button onclick="editSection('${s.id}')">Editar</button>${c.level?`<button onclick="level=${c.level};tab='programar';selectSection('${s.id}')">Programar</button>`:'<span class="muted small">Sin horario</span>'}</div></td></tr>`}).join('')||'<tr><td colspan="8" class="muted">No hay secciones que coincidan con los filtros. Activa cursos desde Oferta y secciones.</td></tr>'}</tbody></table></div></div>`}
function renderReserves(){return `<div class="panel"><h2>Bloques institucionales · Plan Común y CFG</h2><p class="small muted">Registra los horarios informados por Secretaría de Estudios. Estas reservas bloquean las asignaciones de ambos planes para el año correspondiente.</p><div class="flex"><select id="resLevel">${levels().map(o=>`<option value="${o.value}">${o.label}</option>`).join('')}</select><select id="resType"><option>Plan Común</option><option>CFG</option></select><select id="resDay">${DAYS.map((d,i)=>`<option value="${i}">${d}</option>`).join('')}</select><select id="resMod">${TIMES.map((x,i)=>`<option value="${i}">M${i+1} · ${x}</option>`).join('')}</select><button class="primary" onclick="addReserve()">+ Reservar bloque</button></div><div class="tablewrap"><table><tr><th>Año</th><th>Tipo</th><th>Día</th><th>Módulo</th><th></th></tr>${db.reserves.map(r=>`<tr><td>${r.level}</td><td>${esc(r.type)}</td><td>${DAYS[r.day]}</td><td>M${r.mod+1}</td><td><button class="danger" onclick="removeReserve('${r.id}')">Quitar</button></td></tr>`).join('')}</table></div></div>`}function addReserve(){let level=Number($('resLevel').value),type=$('resType').value,day=Number($('resDay').value),mod=Number($('resMod').value);if(db.reserves.some(r=>r.level===level&&r.day===day&&r.mod===mod))return alert('Este bloque ya está reservado.');db.reserves.push({id:uid(),plan:currentPlan,level,type,day,mod});commit()}function removeReserve(id){if(confirm('¿Eliminar esta reserva institucional?')){db.reserves=db.reserves.filter(r=>r.id!==id);commit()}}
function incompatMatches(endpoint,s,c){return endpoint===c.id||endpoint==='s:'+s.id||(endpoint.startsWith('y:')&&Number(endpoint.slice(2))===Number(c.level)&&Number(c.level)>0)}
function incompatOptions(){let result=[];for(const c of db.courses){if(isInstitutional(c))continue;const ss=sectionsFor(c);if(!ss.length)continue;result.push({value:c.id,label:`${c.code} · ${c.name} · Curso completo (${ss.length} ${ss.length===1?'sección':'secciones'})`});for(const s of ss)result.push({value:'s:'+s.id,label:`↳ ${c.code} · ${c.name} · S${s.number}${s.teacherId?' · '+(teacher(s.teacherId)?.name||''):''}`})}return result.sort((a,b)=>a.label.replace(/^↳ /,'').localeCompare(b.label.replace(/^↳ /,''),'es'))}
function incompatLabel(endpoint){if(endpoint.startsWith('y:'))return `${endpoint.slice(2)}.º año · todos los cursos con secciones (ambos planes)`;if(endpoint.startsWith('s:')){const s=section(endpoint.slice(2));if(!s)return 'Sección eliminada';const c=course(s.courseId);return `${c?.code||''} · ${c?.name||''} · S${s.number} (sección específica)`}const c=course(endpoint);return c?`${c.code} · ${c.name} (todas sus secciones)`:'Curso eliminado'}
function renderRestrictions(){const opts=incompatOptions();const selector=(id,placeholder,yearOptions=false)=>`<select id="${id}" style="max-width:420px"><option value="">${placeholder}</option>${yearOptions?'<optgroup label="Año completo">'+getLevelOptions().map(y=>`<option value="y:${y}">${y}.º año · todos los cursos con secciones</option>`).join('')+'</optgroup>':''}<optgroup label="Cursos y secciones con oferta">${opts.map(o=>`<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('')}</optgroup></select>`;return `<div class="panel"><h2>Incompatibilidades entre cursos, secciones y años</h2><p class="muted small">Solo se muestran cursos con secciones creadas, de ambos planes. Puedes relacionar un curso o sección con otro curso, una sección específica o <b>todos los cursos de un año</b>. Las restricciones por año incluyen automáticamente los cursos con secciones que se agreguen después, sin considerar CFG ni Plan Común.</p><div class="flex">${selector('incA','Curso o sección de origen')} ${selector('incB','Curso, sección o año de destino',true)} <button class="primary" onclick="addIncompat()">+ Agregar incompatibilidad</button></div>${opts.length===0?'<p class="muted">Crea secciones en Oferta y secciones para configurar incompatibilidades.</p>':''}<div class="tablewrap"><table><tr><th>Curso o sección A</th><th>Curso, sección o año B</th><th>Acción</th></tr>${db.incompat.map(i=>`<tr><td>${esc(incompatLabel(i.a))}</td><td>${esc(incompatLabel(i.b))}</td><td><button class="danger" onclick="removeIncompat('${i.id}')">Eliminar</button></td></tr>`).join('')}</table></div></div>`}
function addIncompat(){let a=$('incA').value,b=$('incB').value;if(!a||!b||a===b)return alert('Selecciona dos elementos distintos.');const sourceCourse=a.startsWith('s:')?course(section(a.slice(2))?.courseId):course(a);if(b.startsWith('y:')&&sourceCourse?.level===Number(b.slice(2)))return alert('El curso o sección pertenece a ese mismo año. Selecciona otro año para evitar una incompatibilidad consigo mismo.');if(db.incompat.some(i=>(i.a===a&&i.b===b)||(i.a===b&&i.b===a)))return alert('Ya existe esta regla.');db.incompat.push({id:uid(),a,b});commit()}
function removeIncompat(id){db.incompat=db.incompat.filter(i=>i.id!==id);commit()}
function renderExport(){return `<div class="panel"><h2>Exportar horarios en PDF</h2><p class="small muted">Elige un horario individual o todos los horarios de un tipo. Se abrirá una vista preparada para imprimir; en el cuadro de impresión del navegador selecciona «Guardar como PDF».</p><div class="flex"><select id="exportType" onchange="renderExportOptions()"><option value="level">Por año (ambos planes)</option><option value="teacher">Por profesor</option><option value="course">Por curso</option></select><span id="exportOptions"></span><button class="primary" onclick="printSchedule()">Preparar PDF</button></div></div><div class="panel"><h2>Respaldo del proyecto</h2><p>Los cambios se guardan automáticamente en este navegador. Para conservar versiones o trasladar la programación a otro equipo, descarga un JSON e impórtalo desde «Abrir proyecto».</p><div class="actions"><button onclick="saveJSON()">Descargar JSON</button><button onclick="document.getElementById('importFile').click()">Importar JSON</button><button class="danger" onclick="resetProject()">Vaciar horarios del semestre</button></div></div>`}function renderExportOptions(){let type=$('exportType').value,opts=type==='level'?levels():type==='teacher'?teacherOpts():courseOpts();$('exportOptions').innerHTML=`<select id="exportTarget"><option value="all">Todos</option>${opts.map(o=>`<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('')}</select>`}function printSchedule(typeOverride,targetOverride){let type=typeOverride||$('exportType').value,target=targetOverride||$('exportTarget').value;let opts=type==='level'?levels():type==='teacher'?teacherOpts():courseOpts();let items=target==='all'?opts:opts.filter(o=>String(o.value)===target);let content=`<!doctype html><html lang="es"><head><meta charset="utf-8"><title>${esc(db.careerName)} · Horarios ${esc(db.semester)}</title><style>body{font-family:Arial,sans-serif;color:#17304c}h1{font-size:18px}h2{font-size:16px}table{border-collapse:collapse;width:100%;table-layout:fixed}th,td{border:1px solid #bccbd8;padding:7px;font-size:10px;vertical-align:top;height:56px;overflow-wrap:anywhere}th{background:#e5edf6}td.busy{background:#e5effb}td.res{background:#fff0d5}.page{break-after:page;margin-bottom:15px}@page{size:A4 landscape;margin:10mm}button{padding:9px;margin:10px}.coursecheck{display:flex;gap:8px;align-items:center;padding:7px;border-bottom:1px solid #e7edf3}.coursecheck input{flex:none}.semesterbox{border:1px solid #dbe4ee;padding:12px;border-radius:10px;margin:10px 0}.mini{font-size:11px;color:#60758a}.studentgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}.btnlink{border:0;background:transparent;color:#1765a6;padding:3px}.taggood{background:#def5e8;padding:3px 6px;border-radius:5px}</style></head><body><button onclick="window.print()">Imprimir / Guardar como PDF</button>`;for(let item of items){content+=`<div class="page"><h1>${esc(db.careerName)} · ${esc(db.semester)}</h1><h2>${esc(item.label)}</h2><table><tr><th>Módulo</th>${DAYS.map(d=>`<th>${d}</th>`).join('')}</tr>`;for(let m=0;m<6;m++){content+=`<tr><th>M${m+1}<br>${TIMES[m]}</th>`;for(let d=0;d<6;d++){let ss=db.sections.filter(s=>s.slots.some(z=>z.day===d&&z.mod===m)&&(type==='level'?course(s.courseId)?.level===Number(item.value):type==='teacher'?s.teacherId===item.value:s.courseId===item.value));let rs=type==='level'?db.reserves.filter(r=>r.level===Number(item.value)&&r.day===d&&r.mod===m):[];content+=`<td class="${rs.length?'res':ss.length?'busy':''}">${rs.map(r=>esc(r.type)).join('<br>')}${ss.map(s=>`${esc(course(s.courseId)?.name)} · Plan ${esc(course(s.courseId)?.plan)} · S${s.number}<br><small>${esc(teacher(s.teacherId)?.name||'Sin profesor')}</small>`).join('<hr>')}</td>`}content+='</tr>'}content+='</table></div>'}content+='</body></html>';let w=window.open('','_blank');if(!w)return alert('Permite las ventanas emergentes para generar el PDF.');w.document.write(content);w.document.close()}function saveJSON(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Horarios_${db.semester.replace(/[^a-zA-Z0-9-]/g,'_')}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function loadJSON(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.courses)||!Array.isArray(d.sections)||!Array.isArray(d.teachers))throw Error('Estructura no válida');if(!confirm('¿Reemplazar el proyecto actual con el archivo importado?'))return;db=d;normalize();selectedId='';commit()}catch(err){alert('No se pudo importar: '+err.message)}};r.readAsText(file);e.target.value=''}function resetProject(){
 const message='¿Vaciar la programación del semestre actual?\n\nSe eliminarán las secciones de la oferta, sus asignaciones y módulos, los bloques CFG/Plan Común del horario y las incompatibilidades vinculadas a secciones eliminadas. En los ejercicios estudiantiles se limpiará la selección y el horario del semestre actual.\n\nSe conservarán íntegramente los planes de estudio y su banco de cursos, prerrequisitos, equivalencias, profesores, disponibilidades, años adicionales, asignaturas aprobadas y proyecciones futuras.\n\nTe recomendamos descargar antes un respaldo JSON.';
 if(!confirm(message))return;
 const oldSectionIds=new Set(db.sections.map(s=>s.id));
 db.sections=[];
 db.reserves=[];
 db.courses.forEach(c=>{c.sections=0});
 db.incompat=(db.incompat||[]).filter(rule=>{
  // Mantener reglas generales entre cursos/años; descartar solo las que mencionan secciones eliminadas.
  const values=Object.values(rule||{});
  return !values.some(v=>typeof v==='string'&&oldSectionIds.has(v));
 });
 (db.studentPlans||[]).forEach(p=>{p.current=[];p.selectedSections={};p.institutionalSlots={}});
 selectedId='';institutionalMode='';consultationMode=false;
 commit();
 alert('Se vació la programación del semestre. La configuración de los planes de estudio y los datos históricos de estudiantes se conservaron.');
}

// Curriculum bank and student planning. Curricular prerequisites are optional user-defined data.
function curriculumCourse(id){return db.curriculum.find(c=>c.id===id)}
function curriculumLabel(c){return `${c.code} · ${c.name} (${c.plan})`}
function renderCurriculum(){let plans=[...new Set(db.curriculum.map(c=>c.plan))];return `<div class="panel"><div class="flex between"><h2>Configurar planes de estudios · Banco de cursos</h2><div class="flex"><button onclick="document.getElementById('curriculumImportFile').click()">⬆ Recuperar prerrequisitos y equivalencias desde JSON</button><input type="file" id="curriculumImportFile" accept=".json,application/json" class="hidden" onchange="importCurriculumRelations(event)"><button class="primary" onclick="editCurriculumCourse('')">+ Agregar curso al banco</button></div></div><p class="muted small">El banco contiene los cursos de Castellano de los planes B y C. Puedes modificar cursos, sus créditos, el año de referencia, los prerrequisitos y las equivalencias. <b>Los prerrequisitos y las equivalencias están precargados</b> a partir del respaldo Horarios_2027-1-2.json. Las modificaciones al banco no cambian las secciones ya programadas.</p><div class="flex"><label>Plan <select id="currPlan" onchange="currPlan=this.value;render()"><option value="all">Todos</option>${plans.map(p=>`<option value="${esc(p)}" ${currPlan===p?'selected':''}>Plan ${esc(p)}</option>`).join('')}</select></label><label>Buscar <input id="currQuery" value="${esc(currQuery)}" placeholder="Código o nombre" oninput="currQuery=this.value;render();document.getElementById('currQuery').focus()"></label></div><div class="tablewrap" style="max-height:65vh"><table><tr><th>Plan</th><th>Año</th><th>Código</th><th>Curso</th><th>Cr.</th><th>Prerrequisitos</th><th>Equivalente</th><th></th></tr>${db.curriculum.filter(c=>(currPlan==='all'||c.plan===currPlan)&&`${c.code} ${c.name}`.toLowerCase().includes(currQuery.toLowerCase())).sort((a,b)=>a.plan.localeCompare(b.plan)||a.year-b.year||a.name.localeCompare(b.name,'es')).map(c=>`<tr><td>${esc(c.plan)}</td><td>${c.year||'—'}</td><td>${esc(c.code)}</td><td>${esc(c.name)}</td><td>${c.credits}</td><td>${(c.prereqs||[]).map(id=>esc(curriculumCourse(id)?.code||'?')).join(', ')||'—'}</td><td>${esc(curriculumCourse(c.equivalent)?.code||'—')}</td><td><button onclick="editCurriculumCourse('${esc(c.id)}')">Configurar</button> <button onclick="editPrerequisites('${esc(c.id)}')">+ Prerrequisitos</button></td></tr>`).join('')}</table></div></div><div class="panel"><h2>Años y espacios de programación</h2><p class="small muted">Puedes crear años adicionales para programar cursos de formación general u otras actividades. El nuevo año aparecerá en la oferta, construcción de horarios, incompatibilidades y exportación.</p><div class="flex">${getLevelOptions().map(y=>`<span class="pill">${y}.º año</span>`).join('')}<button class="primary" onclick="addYear()">+ Añadir año</button></div></div>`}
let currPlan='all',currQuery='';
function addYear(){let value=prompt('Número del nuevo año o espacio (por ejemplo, 6):',String(Math.max(...db.years,0)+1));if(value===null)return;let y=Number(value);if(!Number.isInteger(y)||y<1||y>99)return alert('Ingresa un número entero entre 1 y 99.');if(db.years.includes(y))return alert('Ese año ya existe.');db.years.push(y);commit()}
function editCurriculumCourse(id){let c=curriculumCourse(id)||{id:'',plan:'B',code:'',name:'',credits:4,year:1,prereqs:[],equivalent:''};let opts=db.curriculum.filter(x=>x.id!==id);modal(`<h2>${id?'Configurar curso del banco':'Nuevo curso del banco'}</h2><div class="studentgrid"><div><label>Plan de estudios</label><input id="ccPlan" value="${esc(c.plan)}" placeholder="B, C..."><label>Código</label><input id="ccCode" value="${esc(c.code)}"><label>Nombre</label><input id="ccName" value="${esc(c.name)}" style="width:100%"><label>Créditos</label><input id="ccCredits" type="number" min="0" value="${c.credits}"><label>Año de referencia</label><select id="ccYear">${getLevelOptions().map(y=>`<option value="${y}" ${c.year===y?'selected':''}>${y}.º año</option>`).join('')}</select></div><div><label>Equivalente (curso de otro plan)</label><select id="ccEquivalent" style="width:100%"><option value="">Sin equivalente</option>${opts.filter(x=>x.plan!==c.plan).map(x=>`<option value="${esc(x.id)}" ${c.equivalent===x.id?'selected':''}>${esc(curriculumLabel(x))}</option>`).join('')}</select><label>Prerrequisitos (puedes seleccionar varios)</label><div style="max-height:280px;overflow:auto;border:1px solid #dce4ed;border-radius:7px">${opts.filter(x=>x.plan===c.plan).map(x=>`<label class="coursecheck"><input class="ccPre" type="checkbox" value="${esc(x.id)}" ${(c.prereqs||[]).includes(x.id)?'checked':''}>${esc(curriculumLabel(x))}</label>`).join('')}</div></div></div><p class="small muted">Las equivalencias se aplican en ambos sentidos para el avance estudiantil. Los prerrequisitos permiten identificar cursos que podrían compartir horario, pero no garantizan que ningún estudiante deba tomar ambos.</p><div class="actions"><button class="primary" onclick="saveCurriculumCourse('${esc(id)}')">Guardar</button>${id?`<button class="danger" onclick="deleteCurriculumCourse('${esc(id)}')">Eliminar del banco</button>`:''}<button onclick="closeModal()">Cancelar</button></div>`)}
function editPrerequisites(id){let c=curriculumCourse(id);if(!c)return;let options=db.curriculum.filter(x=>x.id!==id&&x.plan===c.plan).sort((a,b)=>a.year-b.year||a.code.localeCompare(b.code));modal(`<h2>Prerrequisitos · ${esc(c.code)} · ${esc(c.name)}</h2><p class="small muted">Marca las asignaturas del Plan ${esc(c.plan)} que deben estar aprobadas previamente. Puedes seleccionar varias.</p><div style="max-height:52vh;overflow:auto;border:1px solid #dce4ed;border-radius:7px">${options.map(x=>`<label class="coursecheck"><input class="preChoice" type="checkbox" value="${esc(x.id)}" ${(c.prereqs||[]).includes(x.id)?'checked':''}><span>${x.year}.º año · ${esc(x.code)} · ${esc(x.name)} · ${x.credits} cr.</span></label>`).join('')}</div><div class="actions"><button class="primary" onclick="savePrerequisites('${esc(id)}')">Guardar prerrequisitos</button><button onclick="closeModal()">Cancelar</button></div>`)}
function savePrerequisites(id){let c=curriculumCourse(id);if(!c)return;c.prereqs=[...document.querySelectorAll('.preChoice:checked')].map(x=>x.value);closeModal();commit()}
function saveCurriculumCourse(id){let plan=$('ccPlan').value.trim().toUpperCase(),code=$('ccCode').value.trim().toUpperCase(),name=$('ccName').value.trim(),credits=Number($('ccCredits').value),year=Number($('ccYear').value),pre=[...document.querySelectorAll('.ccPre:checked')].map(x=>x.value),equiv=$('ccEquivalent').value;if(!plan||!code||!name||!Number.isFinite(credits)||credits<0)return alert('Completa los datos válidos.');if(db.curriculum.some(c=>c.id!==id&&c.plan===plan&&c.code===code))return alert('Ya existe ese código en el mismo plan.');let c=id?curriculumCourse(id):{id:uid()};if(!c)return;Object.assign(c,{plan,code,name,credits,year,prereqs:pre,equivalent:equiv});if(!id)db.curriculum.push(c);if(equiv){let other=curriculumCourse(equiv);if(other){if(other.equivalent&&other.equivalent!==c.id){let previous=curriculumCourse(other.equivalent);if(previous)previous.equivalent=''}other.equivalent=c.id}}else db.curriculum.filter(x=>x.equivalent===c.id).forEach(x=>x.equivalent='');closeModal();commit()}
function deleteCurriculumCourse(id){if(!confirm('¿Eliminar este curso del banco? Las secciones ya creadas permanecerán.'))return;db.curriculum=db.curriculum.filter(c=>c.id!==id);db.curriculum.forEach(c=>{c.prereqs=(c.prereqs||[]).filter(x=>x!==id);if(c.equivalent===id)c.equivalent=''});closeModal();commit()}
function prereqRelated(a,b){if(!a||!b)return false;let ca=db.curriculum.find(c=>c.plan===a.plan&&c.code===a.code),cb=db.curriculum.find(c=>c.plan===b.plan&&c.code===b.code);return !!(ca&&cb&&((ca.prereqs||[]).includes(cb.id)||(cb.prereqs||[]).includes(ca.id)))}

let studentId='',studentPlanChoice='B',studentSearch='';
function studentObj(){return db.studentPlans.find(x=>x.id===studentId)}
function newStudent(){let name=prompt('Identificador o nombre del estudiante (opcional):','');if(name===null)return;let pl=prompt('Plan de estudios del estudiante (B o C):','C');if(pl===null)return;pl=pl.trim().toUpperCase();if(!db.curriculum.some(c=>c.plan===pl))return alert('Plan no encontrado.');let o={id:uid(),name,plan:pl,passed:[],current:[],future:[],notes:'',selectedSections:{}};db.studentPlans.push(o);studentId=o.id;commit()}
function setStudent(id){studentId=id;render()}
function studentAvailable(c,p){let prereqs=c.prereqs||[];return prereqs.every(id=>p.passed.includes(id)||p.passed.includes(curriculumCourse(id)?.equivalent))}
function studentDone(c,p){return p.passed.includes(c.id)||!!(c.equivalent&&p.passed.includes(c.equivalent))}
function studentCurrent(c,p){return p.current.includes(c.id)||!!(c.equivalent&&p.current.includes(c.equivalent))}
function studentFuture(c,p){return p.future.some(f=>f.courses.includes(c.id)||c.equivalent&&f.courses.includes(c.equivalent))}
const EPC_FULL_NAMES={"EPC007": "Aprendizaje y desarrollo del pensamiento", "EPC001": "Transformaciones socioculturales en el espacio educativo", "EPC002": "Epistemología y enfoques curriculares", "EPC006": "Didáctica general en contextos diversos", "EPC009": "Fundamentos de las prácticas evaluativas", "EPCM03": "La labor docente en la sociedad digital", "EPC008": "Investigación educativa", "EPC012": "Teoría y desarrollo del currículum", "EPC013": "Diseño del aprendizaje en aulas inclusivas", "EPC014": "Evaluación como aprendizaje", "EPC015": "Ética y profesión docente", "EPC016": "Metodología de investigación educativa"};
function studentCourseName(c){if(!c)return '';if(/^EPC/i.test(c.code)&&(!c.name||/^plan com[uú]n$/i.test(c.name.trim())))return EPC_FULL_NAMES[c.code]||c.name;return c.name}
function studentTotalCredits(p){return studentCredits(db.curriculum.filter(c=>c.plan===p.plan).map(c=>c.id))}
function studentProjectedCredits(p){return p.future.reduce((sum,f)=>sum+studentCredits(f.courses),0)}
function studentCredits(ids){return ids.reduce((n,id)=>n+(Number(curriculumCourse(id)?.credits)||0),0)}
function togglePassed(id){let p=studentObj();if(!p)return;let c=curriculumCourse(id);if(!c)return;let done=studentDone(c,p);p.passed=p.passed.filter(x=>x!==id&&x!==c.equivalent);if(!done){p.passed.push(id);p.current=p.current.filter(x=>x!==id&&x!==c.equivalent);delete p.selectedSections[id];delete p.institutionalSlots?.[id];p.future.forEach(f=>f.courses=f.courses.filter(x=>x!==id&&x!==c.equivalent))}commit()}
function toggleCurrent(id){let p=studentObj();if(!p)return;let c=curriculumCourse(id);if(studentDone(c,p))return;let selected=studentCurrent(c,p);p.current=p.current.filter(x=>x!==id&&x!==c.equivalent);if(selected){delete p.selectedSections[id];delete p.institutionalSlots?.[id];}if(!selected){p.current.push(id);p.future.forEach(f=>f.courses=f.courses.filter(x=>x!==id&&x!==c.equivalent))}commit()}
function studentSections(c){let eq=curriculumCourse(c.equivalent);return db.sections.filter(s=>{let x=course(s.courseId);return x&&((x.plan===c.plan&&x.code===c.code)||(eq&&x.plan===eq.plan&&x.code===eq.code))})}
function selectStudentSection(cid,sid){let p=studentObj();if(!p)return;p.selectedSections??={};if(sid)p.selectedSections[cid]=sid;else delete p.selectedSections[cid];commit()}
function addStudentManualCourse(){
 let p=studentObj();if(!p)return;
 const code=$('manualCourseCode')?.value.trim().toUpperCase(),name=$('manualCourseName')?.value.trim(),credits=Number($('manualCourseCredits')?.value);
 if(!code||!name||!Number.isFinite(credits)||credits<0){alert('Indica código, nombre y créditos válidos.');return}
 const linked=db.curriculum.find(c=>c.plan===p.plan&&c.code.toUpperCase()===code);
 if(linked){
  if(studentDone(linked,p)){alert('Este curso ya está aprobado en la trayectoria.');return}
  if(!studentCurrent(linked,p))toggleCurrent(linked.id);
  else render();
  return;
 }
 if(p.manualCourses.some(c=>c.code===code)){alert('Ese código ya está agregado al horario individual.');return}
 p.manualCourses.push({id:uid(),code,name,credits,slots:[]});commit();
}
function removeStudentManualCourse(id){let p=studentObj();if(!p)return;p.manualCourses=p.manualCourses.filter(c=>c.id!==id);commit()}
function setStudentManualSlot(id,day,mod,checked){let c=studentObj()?.manualCourses.find(c=>c.id===id);if(!c)return;c.slots=c.slots.filter(z=>!(z.day===day&&z.mod===mod));if(checked)c.slots.push({day,mod});commit()}
function manualStudentSlotEditor(c){return `<div class="institutional-slots">${DAYS.map((d,di)=>`<div style="border:1px solid #dbe4ee;border-radius:7px;padding:6px"><b>${d}</b>${TIMES.map((t,mi)=>`<label style="display:block"><input type="checkbox" ${c.slots.some(z=>z.day===di&&z.mod===mi)?'checked':''} onchange="setStudentManualSlot('${esc(c.id)}',${di},${mi},this.checked)"> M${mi+1} · ${t}</label>`).join('')}</div>`).join('')}</div>`}
function studentManualCredits(p){return (p.manualCourses||[]).reduce((n,c)=>n+(Number(c.credits)||0),0)}
function studentManualPanel(p){return `<div class="panel"><div class="flex between"><h3>Agregar curso manualmente al horario individual</h3><span class="pill">${studentManualCredits(p)} créditos adicionales</span></div><p class="small muted">Escribe el código del curso. Si pertenece al plan del estudiante, se incorporará a su selección del semestre sin duplicar créditos y podrás indicar un horario manual cuando no tenga sección. Si es un curso externo, regístralo con su nombre y créditos. El horario es opcional.</p><div class="flex" style="flex-wrap:wrap;gap:8px;align-items:end"><label>Código<input id="manualCourseCode" placeholder="Ej. CFG001 o EXT101" oninput="suggestStudentManualCourse()"></label><label>Nombre<input id="manualCourseName" placeholder="Nombre del curso"></label><label>Créditos<input id="manualCourseCredits" type="number" min="0" step="1" style="width:90px" value="4"></label><button class="primary" onclick="addStudentManualCourse()">+ Agregar al semestre</button></div>${(p.manualCourses||[]).map(c=>`<div class="semesterbox"><div class="flex between"><b>${esc(c.code)} · ${esc(c.name)} · ${c.credits} cr.</b><button class="danger" onclick="removeStudentManualCourse('${esc(c.id)}')">Quitar</button></div><p class="small muted">Horario manual opcional. Sin módulos marcados, el curso permanece sin horario.</p>${manualStudentSlotEditor(c)}</div>`).join('')}</div>`}
function suggestStudentManualCourse(){let p=studentObj();if(!p)return;let code=$('manualCourseCode').value.trim().toUpperCase(),c=db.curriculum.find(x=>x.code.toUpperCase()===code&&(x.plan===p.plan||!db.curriculum.some(y=>y.plan===p.plan&&y.code.toUpperCase()===code)));if(c){$('manualCourseName').value=studentCourseName(c);$('manualCourseCredits').value=c.credits}}
function studentAllSlots(p){let a=[];for(let id of p.current){let c=curriculumCourse(id);if(!c)continue;let sid=p.selectedSections?.[id],ss=section(sid);if(ss)for(let z of ss.slots||[])a.push({...z,label:studentCourseName(c)+' · S'+ss.number});if(!ss)for(let z of p.institutionalSlots?.[id]||[])a.push({...z,label:studentCourseName(c)});}for(let c of p.manualCourses||[])for(let z of c.slots||[])a.push({...z,label:c.name+" · "+c.code});return a}
function studentSlotConflicts(p){let slots=studentAllSlots(p),hits=[];for(let i=0;i<slots.length;i++)for(let j=i+1;j<slots.length;j++)if(slots[i].day===slots[j].day&&slots[i].mod===slots[j].mod)hits.push(`${DAYS[slots[i].day]} M${slots[i].mod+1}: ${slots[i].label} / ${slots[j].label}`);return [...new Set(hits)]}
let studentEditingCourse='',studentPreviewCourse='',studentPreviewSection='';
function studentEditingItems(p){let items=[];for(let id of p.current){let c=curriculumCourse(id);if(!c)continue;let ss=studentSections(c);items.push({id,kind:'curriculum',code:c.code,name:studentCourseName(c),credits:c.credits,sections:ss,slots:p.institutionalSlots?.[id]||[],sid:p.selectedSections?.[id]||''})}for(let c of p.manualCourses||[])items.push({id:c.id,kind:'manual',code:c.code,name:c.name,credits:c.credits,sections:[],slots:c.slots||[]});return items}
function studentChooseEditing(id){studentEditingCourse=id;render()}
function studentToggleGridSlot(day,mod){let p=studentObj();if(!p)return;let it=studentEditingItems(p).find(x=>x.id===studentEditingCourse);if(!it)return;if(it.kind==='curriculum'&&it.sid){alert('El horario de esta sección procede de la programación académica. Para editarlo, modifica la sección en Construir horarios, o déjala sin sección y utiliza un horario manual.');return}let slots=it.kind==='manual'?(p.manualCourses.find(c=>c.id===it.id)?.slots||[]):(p.institutionalSlots?.[it.id]||[]);let exists=slots.some(z=>z.day===day&&z.mod===mod);slots=slots.filter(z=>!(z.day===day&&z.mod===mod));if(!exists)slots.push({day,mod});if(it.kind==='manual')p.manualCourses.find(c=>c.id===it.id).slots=slots;else{p.institutionalSlots??={};p.institutionalSlots[it.id]=slots}commit()}
function studentCourseNotes(id,value){let p=studentObj();if(!p)return;p.courseNotes??={};p.courseNotes[id]=value;persist()}
function studentPreview(id,sid){studentPreviewCourse=id;studentPreviewSection=sid||'';render()}
function studentStopPreview(){studentPreviewCourse='';studentPreviewSection='';render()}
function studentPreviewSlots(c,sid){let sec=section(sid);return sec?(sec.slots||[]):[]}
function studentSlotAnalysis(base,candidate){let occupied=new Map(),conflicts=[];for(let z of base){let k=slotKey(z.day,z.mod);if(!occupied.has(k))occupied.set(k,[]);occupied.get(k).push(z.label)}for(let z of candidate){let k=slotKey(z.day,z.mod);if(occupied.has(k))conflicts.push(`${DAYS[z.day]} · M${z.mod+1} (${occupied.get(k).join(', ')})`)}let merged=[...base,...candidate],windows=0;for(let d=0;d<6;d++){let mods=[...new Set(merged.filter(z=>z.day===d).map(z=>z.mod))].sort((a,b)=>a-b);if(mods.length>1)windows+=mods[mods.length-1]-mods[0]+1-mods.length}return {conflicts,windows}}
function studentCandidateAnalysis(p,c,sid){let ss=studentSections(c),chosen=sid||ss[0]?.id||'',slots=studentPreviewSlots(c,chosen),base=studentAllSlots(p);return {...studentSlotAnalysis(base,slots),slots,chosen}}
function studentAddOffered(cid,sid){let p=studentObj(),c=curriculumCourse(cid);if(!p||!c||studentDone(c,p))return;if(!studentCurrent(c,p))toggleCurrent(cid);p=studentObj();if(sid){p.selectedSections??={};p.selectedSections[cid]=sid}studentEditingCourse=cid;studentPreviewCourse='';studentPreviewSection='';commit()}
function studentRemoveOffered(cid){let p=studentObj();if(!p)return;if(p.current.includes(cid))toggleCurrent(cid);studentPreviewCourse='';studentPreviewSection=''}
function studentScheduleEditor(p){
 let items=studentEditingItems(p);if(!items.some(x=>x.id===studentEditingCourse))studentEditingCourse=items[0]?.id||'';
 let active=items.find(x=>x.id===studentEditingCourse),base=studentAllSlots(p);
 let candidate=curriculumCourse(studentPreviewCourse),preview=candidate?studentCandidateAnalysis(p,candidate,studentPreviewSection):null;
 let previewSlots=preview?.slots||[];
 let offered=db.curriculum.filter(c=>c.plan===p.plan&&!studentDone(c,p)&&!studentCurrent(c,p)&&(studentOffering(c)||/^(CFG|EPC)/i.test(c.code)));
 let card=c=>{let ss=studentSections(c),a=studentCandidateAnalysis(p,c),isPreview=studentPreviewCourse===c.id,selectedSid=isPreview?(studentPreviewSection||a.chosen):a.chosen,analysis=isPreview?studentCandidateAnalysis(p,c,selectedSid):a;
 return `<div class="student-editor-item ${isPreview?'active':''}"><div class="flex between" style="align-items:flex-start"><div style="flex:1;min-width:0"><b>${esc(studentCourseName(c))}</b><div class="small muted">${esc(c.code)} · ${c.credits} créditos · Plan ${esc(c.plan)}</div>${studentEquivalentLabel(c)}<div class="small ${analysis.conflicts.length?'bad':'good'}">${ss.length?(analysis.conflicts.length?'⚠ Tendría tope ('+analysis.conflicts.length+')':'✓ Sin topes'):'Sin horario asignado'} · ${analysis.windows} ventana(s) en horario resultante</div></div></div>${ss.length?`<label class="small">Sección para consultar <select onchange="studentPreview('${esc(c.id)}',this.value)">${ss.map(x=>`<option value="${esc(x.id)}" ${selectedSid===x.id?'selected':''}>S${x.number} · ${esc(teacher(x.teacherId)?.name||'Sin docente')} · ${x.slots.length} módulos</option>`).join('')}</select></label>`:''}<div class="actions" style="margin-top:7px"><button onclick="studentPreview('${esc(c.id)}','${esc(selectedSid)}')">${isPreview?'Actualizar vista':'Previsualizar'}</button><button class="primary" onclick="studentAddOffered('${esc(c.id)}','${esc(selectedSid)}')">+ Incorporar</button></div></div>`};
 return `<div class="student-editor-layout"><div><p class="small muted">Selecciona un curso incorporado para editar su horario manual. Usa «Previsualizar» en los cursos disponibles para comprobar topes y ventanas antes de incorporarlos.</p>${candidate?`<div class="panel" style="background:#f0f7ff;border-color:#86b9ed;padding:10px;margin-bottom:10px"><div class="flex between"><b>Vista previa: ${esc(studentCourseName(candidate))} · ${esc(candidate.code)}</b><button onclick="studentStopPreview()">Cerrar vista previa</button></div><p class="${preview.conflicts.length?'bad':'good'} small">${preview.conflicts.length?'⚠ '+preview.conflicts.length+' tope(s): '+esc(preview.conflicts.join('; ')):'✓ No se producirían topes'} · ${preview.windows} ventana(s) en el horario resultante</p><button class="primary" onclick="studentAddOffered('${esc(candidate.id)}','${esc(preview.chosen)}')">Incorporar este curso</button></div>`:''}<div class="student-editor-grid"><div class="student-editor-head">Módulo</div>${DAYS.map(d=>`<div class="student-editor-head">${d}</div>`).join('')}${TIMES.map((t,m)=>`<div class="student-editor-time"><b>M${m+1}</b><br>${t}</div>${DAYS.map((d,day)=>{let hits=base.filter(z=>z.day===day&&z.mod===m),ghost=previewSlots.some(z=>z.day===day&&z.mod===m),selected=active&&((active.kind==='manual'?active.slots:active.sid?(section(active.sid)?.slots||[]):active.slots).some(z=>z.day===day&&z.mod===m));return `<button type="button" class="student-editor-cell ${selected?'student-editor-selected':''} ${hits.length?'student-editor-occupied':''}" style="${ghost?'outline:3px solid '+(hits.length?'#dc5353':'#38a169')+';outline-offset:-3px;background:'+(hits.length?'#ffe4e6':'#e0f5e9')+';':''}" onclick="${candidate?'studentStopPreview()':`studentToggleGridSlot(${day},${m})`}" title="${ghost?'Vista previa':active?'Editar '+esc(active.name):'Selecciona un curso'}">${hits.map(z=>`<span class="student-editor-chip">${esc(z.label)}</span>`).join('')}${ghost?`<span class="student-editor-chip" style="background:${hits.length?'#ffc9d0':'#c5efd3'}">${esc(studentCourseName(candidate))} · vista previa</span>`:''}${!hits.length&&!ghost?'<span class="student-editor-plus">+</span>':''}</button>`}).join('')}`).join('')}</div>${studentSlotConflicts(p).length?`<p class="bad"><b>Topes actuales:</b> ${studentSlotConflicts(p).map(esc).join('; ')}</p>`:'<p class="good small">Sin topes entre los cursos incorporados.</p>'}</div><div class="student-editor-side"><h3>Cursos incorporados · ${studentCredits(p.current)+studentManualCredits(p)} cr.</h3>${items.map(it=>`<div class="student-editor-item ${it.id===studentEditingCourse?'active':''}"><div class="flex between"><div><b>${esc(it.name)}</b><div class="small muted">${esc(it.code)} · ${it.credits} créditos</div></div><button onclick="studentChooseEditing('${esc(it.id)}')">${it.id===studentEditingCourse?'✓ Editando':'Programar'}</button></div>${it.sections.length?`<label class="small">Sección <select onchange="selectStudentSection('${esc(it.id)}',this.value)"><option value="">Sin sección · horario manual</option>${it.sections.map(ss=>`<option value="${esc(ss.id)}" ${it.sid===ss.id?'selected':''}>S${ss.number} · ${esc(teacher(ss.teacherId)?.name||'Sin profesor')} · ${ss.slots.length} módulos</option>`).join('')}</select></label>`:''}<div class="small muted">${it.sid?'Horario de sección asignada':it.slots.length?it.slots.length+' módulos manuales':'Sin horario · puedes agregar módulos'}</div><label class="small">Observación del curso<textarea style="width:100%;min-height:48px" placeholder="Observaciones sobre esta asignatura" onchange="studentCourseNotes('${esc(it.id)}',this.value)">${esc(p.courseNotes?.[it.id]||'')}</textarea></label><div class="actions">${it.kind==='manual'?`<button class="danger" onclick="removeStudentManualCourse('${esc(it.id)}')">Quitar curso</button>`:`<button onclick="studentRemoveOffered('${esc(it.id)}')">Quitar del semestre</button>`}</div></div>`).join('')||'<p class="muted">Todavía no hay cursos incorporados.</p>'}<h3 style="margin-top:18px">Cursos disponibles para este semestre · ${offered.length}</h3><p class="small muted">Cursos pendientes con oferta activa, más CFG y Plan Común. Puedes previsualizar cualquier sección antes de incorporarla.</p><div style="max-height:650px;overflow:auto">${offered.map(card).join('')||'<p class="muted">No hay más cursos disponibles.</p>'}</div></div></div>`;
}
function studentScheduleHTML(p){let slots=studentAllSlots(p);return `<div class="tablewrap"><table><tr><th>Módulo</th>${DAYS.map(d=>`<th>${d}</th>`).join('')}</tr>${TIMES.map((time,m)=>`<tr><th>M${m+1} · ${time}</th>${DAYS.map((day,d)=>`<td>${slots.filter(z=>z.day===d&&z.mod===m).map(z=>`<div style="padding:4px;margin:2px 0;background:#e9f2fb;border-radius:5px">${esc(z.label)}</div>`).join('')}</td>`).join('')}</tr>`).join('')}</table></div>`}
function setInstitutionalSlot(cid,day,mod,checked){let p=studentObj();if(!p)return;p.institutionalSlots??={};let a=p.institutionalSlots[cid]||[];a=a.filter(z=>!(z.day===day&&z.mod===mod));if(checked)a.push({day,mod});p.institutionalSlots[cid]=a;commit()}
function institutionalSlotEditor(cid,p){let a=p.institutionalSlots?.[cid]||[];return `<div class="small muted" style="margin:7px 0">Horario manual (opcional). Marca los módulos correspondientes o déjalos todos sin marcar.</div><div class="institutional-slots">${DAYS.map((d,di)=>`<div style="border:1px solid #dbe4ee;border-radius:7px;padding:6px"><b>${d}</b>${TIMES.map((t,mi)=>`<label style="display:block"><input type="checkbox" ${a.some(z=>z.day===di&&z.mod===mi)?'checked':''} onchange="setInstitutionalSlot('${esc(cid)}',${di},${mi},this.checked)"> M${mi+1} · ${t}</label>`).join('')}</div>`).join('')}</div>`}
function studentCurriculumMap(p,interactive=true){
 const courses=db.curriculum.filter(c=>c.plan===p.plan);
 const columns=Array.from({length:10},(_,i)=>{
  const year=Math.floor(i/2)+1,semester=i%2;
  const inYear=courses.filter(c=>Number(c.year)===year);
  return inYear.slice(semester===0?0:6,semester===0?6:undefined);
 });
 const status=c=>studentDone(c,p)?'done':studentCurrent(c,p)?'current':studentFuture(c,p)?'future':'pending';
 const roman=['I','II','III','IV','V','VI','VII','VIII','IX','X'];
 return `<div class="curriculum-legend"><span><i class="curriculum-dot" style="background:#d9f4e3"></i>Aprobado</span><span><i class="curriculum-dot" style="background:#dcecff"></i>Próximo semestre</span><span><i class="curriculum-dot" style="background:#f4e5ff"></i>Proyectado</span><span><i class="curriculum-dot" style="background:#f8fafc"></i>Pendiente</span></div>
 <div class="curriculum-map semester-map"><div class="semester-map-grid">${columns.map((group,i)=>`<div class="semester-column"><div class="semester-column-title">${roman[i]}<small>${Math.floor(i/2)+1}.º año</small></div><div class="semester-column-courses">${group.map(c=>`<${interactive?'button':'div'} ${interactive?`type="button" onclick="togglePassed('${esc(c.id)}')" aria-pressed="${studentDone(c,p)}"`: ''} class="semester-course ${status(c)} ${interactive?'semester-course-action':''}" title="${esc(studentCourseName(c))} · ${c.credits} créditos${interactive?' · Haz clic para marcar o desmarcar como aprobado':''}"><strong>${esc(c.code)}</strong><span>${esc(studentCourseName(c))}</span><small>${c.credits} cr.${studentFuture(c,p)?' · '+esc(p.future.find(f=>f.courses.includes(c.id))?.name||'Futuro'): ''}</small></${interactive?'button':'div'}>`).join('')}</div><div class="semester-column-credits">${studentCredits(group.map(c=>c.id))} créditos</div></div>`).join('')}</div></div>`;
}
function addFuture(){let p=studentObj();if(!p)return;p.future.push({id:uid(),name:'Semestre proyectado '+(p.future.length+1),courses:[],notes:''});commit()}
function toggleFuture(fid,cid){let p=studentObj(),f=p?.future.find(x=>x.id===fid),c=curriculumCourse(cid);if(!f||!c||studentDone(c,p)||studentCurrent(c,p))return;let was=f.courses.includes(cid);p.future.forEach(z=>z.courses=z.courses.filter(x=>x!==cid&&x!==c.equivalent));if(!was)f.courses.push(cid);commit()}
function editFuture(fid,field,value){let f=studentObj()?.future.find(x=>x.id===fid);if(f){f[field]=value;persist()}}
function removeFuture(fid){if(!confirm('¿Eliminar este semestre proyectado?'))return;studentObj().future=studentObj().future.filter(f=>f.id!==fid);commit()}
function saveStudentNotes(value){let p=studentObj();if(p){p.notes=value;persist()}}
function studentOffering(c){return studentSections(c).length>0}

adius:5px;cursor:pointer}@media print{body{padding:0}.toolbar{display:none}.section{break-inside:auto}h2{break-after:avoid-page}.malla{break-inside:auto;page-break-inside:auto}.malla tr{break-inside:avoid}.malla td{break-inside:auto}}
 </style></head><body><div class="toolbar"><button onclick="setTimeout(()=>window.print(),250)">Imprimir / Guardar como PDF</button> <span>Para conservar los colores, activa «Gráficos de fondo» en la impresión.</span></div><h1>${esc(db.careerName)} · Planificación estudiantil</h1><p class="meta"><b>Estudiante:</b> ${esc(p.name||'Sin nombre')} &nbsp; <b>Plan:</b> ${esc(p.plan)} &nbsp; <b>Periodo:</b> ${esc(db.semester)}</p><div class="totals"><span class="total">Plan: <b>${studentTotalCredits(p)} cr.</b></span><span class="total">Aprobados: <b>${studentCredits(done.map(c=>c.id))} cr.</b></span><span class="total">Próximo semestre: <b>${studentCredits(p.current)+studentManualCredits(p)} cr.</b></span><span class="total">Proyectados: <b>${studentProjectedCredits(p)} cr.</b></span><span class="total">Pendientes: <b>${studentCredits(cs.filter(c=>!studentDone(c,p)).map(c=>c.id))} cr.</b></span></div>
 <div class="section"><h2>1. Plan de estudios</h2><div class="legend"><span><i class="swatch done"></i>Aprobado</span><span><i class="swatch current"></i>Próximo semestre</span><span><i class="swatch future-color"></i>Proyectado</span><span><i class="swatch pending"></i>Pendiente</span></div>${map}</div>
 <div class="section"><h2>2. Cursos del próximo semestre · ${studentCredits(p.current)+studentManualCredits(p)} créditos</h2>${list}</div>

 <div class="section"><h2>4. Proyecciones de otros semestres</h2>${future}</div><div class="section"><h2>5. Observaciones generales</h2><p>${esc(p.notes||'Sin observaciones.')}</p></div></body></html>`;

function printStudent(){
 let p=studentObj();if(!p)return;
 // Evita document.write en una ventana vacía: Safari puede imprimirla sin contenido.
 // El informe se entrega como documento HTML completo y autónomo.
 let html=studentReportHTML(p);
 let blob=new Blob([html],{type:'text/html;charset=utf-8'});
 let url=URL.createObjectURL(blob);
 let w=window.open(url,'_blank');
 if(!w){downloadStudentReport();alert('El navegador bloqueó la ventana. Se descargó el informe imprimible: ábrelo y usa Imprimir → Guardar como PDF.');}
 // Mantener la URL viva durante la impresión; no revocarla de inmediato.
}
function downloadStudentReport(){
 let p=studentObj();if(!p)return;
 let blob=new Blob([studentReportHTML(p)],{type:'text/html;charset=utf-8'});
 let url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='Informe_estudiante_'+(p.name||'sin_nombre').replace(/[^a-z0-9_-]/gi,'_')+'.html';
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
}
function downloadStudent(){let p=studentObj();if(!p)return;let blob=new Blob([JSON.stringify({career:db.careerName,semester:db.semester,student:p,curriculum:db.curriculum.filter(c=>c.plan===p.plan)},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='Plan_estudiante_'+(p.name||'sin_nombre').replace(/[^a-z0-9_-]/gi,'_')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}

// Importa únicamente relaciones curriculares desde un respaldo anterior.
// No sustituye oferta, secciones, profesores, estudiantes ni horarios.
function importCurriculumRelations(event){
 const file=event.target.files?.[0];if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const data=JSON.parse(reader.result);
   const incoming=Array.isArray(data.curriculum)?data.curriculum:null;
   if(!incoming)throw Error('El JSON no contiene una lista «curriculum». Debes importar un respaldo completo del proyecto, no un HTML.');
   const byId=new Map(db.curriculum.map(c=>[c.id,c]));
   const byCode=new Map(db.curriculum.map(c=>[`${c.plan}:${String(c.code).toUpperCase()}`,c]));
   const locate=c=>byId.get(c.id)||byCode.get(`${c.plan}:${String(c.code||'').toUpperCase()}`);
   const sourceById=new Map(incoming.map(c=>[c.id,c]));
   let matched=0,prereqCourses=0,equivCourses=0,missing=[];
   const changes=[];
   for(const src of incoming){
    const dest=locate(src);if(!dest){if(src.prereqs?.length||src.equivalent)missing.push(`${src.plan} · ${src.code}`);continue}
    matched++;
    const pre=(Array.isArray(src.prereqs)?src.prereqs:[]).map(id=>{
      const target=sourceById.get(id)||incoming.find(x=>x.id===id);
      return target?locate(target)?.id:byId.get(id)?.id;
    }).filter(Boolean).filter(id=>id!==dest.id);
    const eqSource=sourceById.get(src.equivalent);
    const eq=eqSource?locate(eqSource)?.id:(byId.has(src.equivalent)?src.equivalent:'');
    if(pre.length)prereqCourses++;
    if(eq)equivCourses++;
    changes.push({dest,pre:[...new Set(pre)],eq:eq||''});
   }
   if(!matched)throw Error('No se encontraron cursos coincidentes entre ambos bancos de cursos.');
   const msg=`Se encontraron ${matched} cursos coincidentes.\n\nCursos con prerrequisitos: ${prereqCourses}\nCursos con equivalencias: ${equivCourses}\n${missing.length?'Relaciones sin curso de destino: '+missing.join(', ')+'\n':''}\n¿Reemplazar SOLO los prerrequisitos y equivalencias de los cursos coincidentes? No se modificarán los horarios, secciones ni estudiantes.`;
   if(!confirm(msg))return;
   for(const {dest,pre,eq} of changes){dest.prereqs=pre;dest.equivalent=eq}
   // Garantiza reciprocidad de equivalencias como lo hace el editor curricular.
   for(const {dest,eq} of changes)if(eq){const other=byId.get(eq);if(other)other.equivalent=dest.id}
   commit();alert(`Relaciones importadas: ${prereqCourses} cursos con prerrequisitos y ${equivCourses} con equivalencias. Revisa Configurar planes.`);
  }catch(err){alert('No fue posible importar las relaciones: '+err.message)}
  finally{event.target.value=''}
 };
 reader.readAsText(file);
}
